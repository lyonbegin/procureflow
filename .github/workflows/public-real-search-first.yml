name: Public one-tender real search-first (no simulation)
on:
  push:
    branches:
      - feature/public-search-first-real-20261103
    paths:
      - g2b_search_first.py
      - g2b_bid_collector.py
      - g2b_bid_package.py
      - main.py
      - worker.py
      - tests/test_public_search_first.py
      - tests/test_public_real_cost_policy.py
      - static/public-search.html
      - .github/workflows/public-real-search-first.yml
  workflow_dispatch:

jobs:
  real-source-query-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original database driver
        run: python -m pip install "psycopg[binary]>=3.1,<4" "fastapi>=0.110" "pydantic>=2,<3"
      - name: Compile actual backend and worker source
        run: python -m compileall -q g2b_search_first.py g2b_bid_package.py main.py worker.py
      - name: One selected tender, actual original verified 10digit SQL, dates and existing real collector action
        run: python tests/test_public_search_first.py
      - name: In-house versus subcontract documented cost policy
        run: python tests/test_public_real_cost_policy.py
      - name: Validate actual search-workbench inline browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("static/public-search.html").read_text()
          assert "실제 G2B" in page
          assert '<script>' in page
          js=page.split("<script>")[-1].split("</script>")[0]
          Path("/tmp/public-search.js").write_text(js)
          PY
          node --check /tmp/public-search.js
      - name: Verify new real search endpoints and not standalone fake runner
        run: |
          python - <<'PY'
          from pathlib import Path
          api=Path('main.py').read_text()
          worker=Path('worker.py').read_text()
          query=Path('g2b_search_first.py').read_text()
          assert '/api/g2b/public/selected/search' in api
          assert "job['source']=='g2b_filtered'" in worker
          assert "r.result_kind IN ('opening','award')" in query
          assert "c.evidence_level='official_direct'" in query
          assert "g2b_case_10yr_windows" not in query
          assert "collect_filtered_gaps" in query
          assert "g2b_bid_collector" in query
          collector=Path('g2b_bid_collector.py').read_text()
          assert '0 if bid_numbers else remove_superseded_bid_rows()' in collector
          assert "new_n8n" not in query
          print('ORIGINAL_G2B_WORKER_REAL_QUERY_ONLY_CONTRACT_PASS')
          PY

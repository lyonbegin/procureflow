name: HITEL programmatic API contract and security tests

on:
  push:
    branches:
      - feature/hitel-integrations-api-20261118
      - fix/hitel-long-research-status-20261119
      - fix/hitel-room-tab-isolation-20261120
    paths:
      - "chatgpt-android-relay/web/integration_api.py"
      - "chatgpt-android-relay/web/integration_public.py"
      - "chatgpt-android-relay/web/long_job_events.py"
      - "chatgpt-android-relay/web/tests/test_long_job_status.py"
      - "chatgpt-android-relay/web/tests/test_multi_room_dispatch.py"
      - "chatgpt-android-relay/web/tests/test_multi_tab_worker.py"
      - ".github/scripts/hitel_room_tab_pool.py"
      - "chatgpt-android-relay/web/tests/test_integration_public.py"
      - "chatgpt-android-relay/web/tests/test_worker_fresh_chat.py"
      - "chatgpt-android-relay/web/tests/test_worker_protocol_upgrade.py"
      - "chatgpt-android-relay/web/tests/test_long_running_reply.py"
      - ".github/scripts/w2a_relay_worker.py"
      - "chatgpt-android-relay/web/static/integrations-public.html"
      - "chatgpt-android-relay/web/worker_autostart.py"
      - ".github/scripts/w2a_relay_worker.py"
      - ".github/scripts/w2a_worker_fallback.py"
      - "chatgpt-android-relay/web/bridge_qa_api.py"
      - "chatgpt-android-relay/web/tests/test_worker_autostart.py"
      - "chatgpt-android-relay/web/app.py"
      - "chatgpt-android-relay/web/tests/test_integrations_api.py"
      - "chatgpt-android-relay/web/file_scenario_api.py"
      - "chatgpt-android-relay/web/gh_oidc.py"
      - "chatgpt-android-relay/web/tests/test_file_scenario_api.py"
      - "chatgpt-android-relay/web/integration_pairing.py"
      - "chatgpt-android-relay/web/tests/test_integration_pairing.py"
      - "chatgpt-android-relay/web/bridge_qa_api.py"
      - ".github/scripts/w2a_file_api_client.py"
      - ".github/scripts/w2a_file_api_scenarios.py"
      - "docs/hitel-integrations/**"
      - ".github/workflows/hitel-integrations-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitel-programmatic-api-contract-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install relay test dependencies
        run: python3 -m pip install -q -r chatgpt-android-relay/web/requirements.txt
      - name: Validate Python syntax
        run: |
          python3 -m py_compile docs/hitel-integrations/example_client.py
          python3 -m py_compile chatgpt-android-relay/web/integration_api.py
          python3 -m py_compile chatgpt-android-relay/web/integration_public.py
          python3 -m py_compile chatgpt-android-relay/web/long_job_events.py
          python3 -m py_compile chatgpt-android-relay/web/worker_autostart.py
          python3 -m py_compile .github/scripts/w2a_relay_worker.py
          python3 -m py_compile .github/scripts/hitel_room_tab_pool.py
          python3 -m py_compile .github/scripts/w2a_worker_fallback.py
          python3 -m py_compile chatgpt-android-relay/web/file_scenario_api.py
          python3 -m py_compile chatgpt-android-relay/web/integration_pairing.py
          python3 -m py_compile chatgpt-android-relay/web/bridge_qa_api.py
          python3 -m py_compile chatgpt-android-relay/web/gh_oidc.py
          python3 -m py_compile .github/scripts/w2a_file_api_client.py
          python3 -m py_compile .github/scripts/w2a_file_api_scenarios.py
          python3 -m py_compile chatgpt-android-relay/web/app.py
      - name: Execute isolated API security and contract cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PUBLIC_SMOKE_ONLY: "1"
          WEB_SESSION_SIGNING_KEY: "test-only-non-secret-signing-key-in-github-ci-20261118"
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_integrations_api.py -v
      - name: Execute synthetic multipart HTTP file/API integrity tests
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_file_scenario_api.py -v
      - name: Verify signed GitHub account pairing and real key issuance contract
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_integration_pairing.py -v
      - name: Verify on-demand worker start, fallback and durable duplicate suppression
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_worker_autostart.py -v
      - name: Verify public no-login API, GitHub autostart and private-room isolation
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_integration_public.py -v
      - name: Verify room-affine concurrent queue and stuck-room isolation
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_multi_room_dispatch.py -v
      - name: Verify independent Chrome owned-tab vendor instance pools
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_multi_tab_worker.py -v
      - name: Verify long-job status, request lookup and lossless final bytes
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_long_job_status.py -v
      - name: Verify two fresh conversations and deduplicated structured output
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_worker_fresh_chat.py -v
      - name: Ensure old GitHub Chrome workers rejected after code upgrades
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_worker_protocol_upgrade.py -v
      - name: Confirm ten-minute wait is non-terminal and never drops an active ChatGPT job
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_long_running_reply.py -v
      - name: Validate static OpenAPI contract
        run: |
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('docs/hitel-integrations/openapi.yaml').read_text())
          assert doc['openapi']=='3.0.3'
          expected={'/integrations/v1/capabilities','/integrations/v1/rooms',
                    '/integrations/v1/chat','/integrations/v1/jobs/{job_id}',
                    '/integrations/v1/files'}
          assert expected <= set(doc['paths'])
          print('PASS_STATIC_OPENAPI_PATHS')
          PY

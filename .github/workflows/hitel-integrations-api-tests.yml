name: HITEL programmatic API contract and security tests

on:
  push:
    branches:
      - feature/hitel-integrations-api-20261118
    paths:
      - "chatgpt-android-relay/web/integration_api.py"
      - "chatgpt-android-relay/web/app.py"
      - "chatgpt-android-relay/web/tests/test_integrations_api.py"
      - ".github/workflows/hitel-integrations-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitel-programmatic-api-contract
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install relay test dependencies
        run: python3 -m pip install -q -r chatgpt-android-relay/web/requirements.txt
      - name: Validate Python syntax
        run: |
          python3 -m py_compile chatgpt-android-relay/web/integration_api.py
          python3 -m py_compile chatgpt-android-relay/web/app.py
      - name: Execute isolated API security and contract cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PUBLIC_SMOKE_ONLY: "1"
          WEB_SESSION_SIGNING_KEY: "test-only-non-secret-signing-key-in-github-ci-20261118"
        run: python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_integrations_api.py -v

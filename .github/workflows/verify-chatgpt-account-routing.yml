name: HITEL account-per-message routing safety regression
on:
  push:
    branches:
      - fix/chatgpt-request-account-routing-20261116
      - test/chatgpt-login-scenario-matrix-20261116
      - fix/hitel-live-account-relay-20261116
      - fix/hitel-account-isolation-preflight-20261116
      - fix/hitel-identity-login-truthful-ui-20261116
    paths:
      - 'chatgpt-android-relay/web/**'
      - '.github/workflows/verify-chatgpt-account-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-routing-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install relay dependencies
        run: python -m pip install -r chatgpt-android-relay/web/requirements.txt
      - name: Compile relevant modules
        run: |
          python -m py_compile chatgpt-android-relay/web/api_v1.py chatgpt-android-relay/web/web_chat.py chatgpt-android-relay/web/app.py
      - name: Validate account-selection browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("chatgpt-android-relay/web/static/chat.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,re.DOTALL)
          assert len(scripts)==1
          assert "selectChatGPTAccountRoom" in scripts[0]
          assert "account_id:accountId" in scripts[0]
          assert "resetActiveRoom()" in scripts[0]
          Path("/tmp/hitel-account-switch.js").write_text(scripts[0],encoding="utf-8")
          print("PASS_ACCOUNT_SPECIFIC_ROOM_BROWSER_STRUCTURE")
          PY
          node --check /tmp/hitel-account-switch.js
      - name: Assert account UI cannot pretend selection is login
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path("chatgpt-android-relay/web/static/chat.html").read_text(encoding="utf-8")
          assert "공식 로그인 미설정 · 계정 추가 불가" in h
          assert "대상 선택 (로그인 아님)" in h
          assert "대상 선택됨 · 로그인 아님" in h
          assert "실제 Chrome 로그인 별도" in h
          assert 'disabled=!data.oauthAvailable' in h
          account=Path("chatgpt-android-relay/web/chatgpt_accounts.py").read_text(encoding="utf-8")
          assert 'raise HTTPException(503' in account
          assert 'response.json().get("id_token")' in account
          assert 'jwt.decode(token,' in account
          print("PASS_NO_EMAIL_ONLY_OR_FAKE_CHATGPT_ACCOUNT_LOGIN")
          PY
      - name: Verify account binding and wrong-worker rejection
        run: python chatgpt-android-relay/web/tests/test_account_request_routing.py
      - name: Exercise 15 account lifecycle scenarios
        run: python chatgpt-android-relay/web/tests/test_login_scenario_matrix.py
      - name: Verify cross-account thread separation and Android fallback protections
        run: python chatgpt-android-relay/web/tests/test_account_isolation_advanced.py
      - name: Existing account-safety regression
        run: python chatgpt-android-relay/web/tests/test_chatgpt_account_safety.py
      - name: Existing Web2API relay regression
        run: python chatgpt-android-relay/web/tests/test_web2api_bridge.py

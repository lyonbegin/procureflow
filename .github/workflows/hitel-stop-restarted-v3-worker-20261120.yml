name: HITEL stop re-launched old protocol-v3 worker once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-stop-restarted-v3-worker-20261120.yml
permissions:
  contents: read
  actions: write
jobs:
  force-stop-only-specified-old-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force stop exact obsolete worker without touching stored rooms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=44560535676
          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET" --jq '.status')"
          echo "TARGET=$TARGET STATE=$RUN_STATE"
          if [[ "$RUN_STATE" == "in_progress" || "$RUN_STATE" == "queued" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET/force-cancel" > /dev/null
            echo "FORCE_CANCELLATION_REQUESTED_FOR=$TARGET"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET" --jq '.status'

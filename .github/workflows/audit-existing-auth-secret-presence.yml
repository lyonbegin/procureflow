name: Audit existing authentication secret NAMES only (never read values into logs)
on:
  push:
    branches: [experiment/github-hosted-chatgpt-web2api-chrome-20261112]
    paths: [.github/workflows/audit-existing-auth-secret-presence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-secret-presence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FREEMOA_SESSION_B64: ${{ secrets.FREEMOA_SESSION_B64 }}
      FREEMOA_GOOGLE_EMAIL: ${{ secrets.FREEMOA_GOOGLE_EMAIL }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      FREEMOA_SESSION_ENCRYPTION_KEY: ${{ secrets.FREEMOA_SESSION_ENCRYPTION_KEY }}
      W2A_LOGIN_PASSWORD: ${{ secrets.W2A_LOGIN_PASSWORD }}
      W2A_PROFILE_KEY: ${{ secrets.W2A_PROFILE_KEY }}
      HITEL_GITHUB_WORKFLOW_TOKEN: ${{ secrets.HITEL_GITHUB_WORKFLOW_TOKEN }}
      CHATGPT_SESSION_B64: ${{ secrets.CHATGPT_SESSION_B64 }}
    steps:
      - name: Print only boolean secret presence (no values, no profile files)
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import os,json
          names=[
            "FREEMOA_SESSION_B64", "FREEMOA_GOOGLE_EMAIL",
            "FREEMOA_GOOGLE_PASSWORD","FREEMOA_SESSION_ENCRYPTION_KEY",
            "W2A_LOGIN_PASSWORD","W2A_PROFILE_KEY",
            "HITEL_GITHUB_WORKFLOW_TOKEN","CHATGPT_SESSION_B64"
          ]
          print("EXISTING_SECRET_PRESENCE_ONLY="+json.dumps(
            {name: bool(os.getenv(name,'')) for name in names},
            ensure_ascii=False,sort_keys=True
          ))
          print("SECRET_VALUES_NEVER_PRINTED")
          PY

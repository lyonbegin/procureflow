name: HITEL Web2API HTTP-only offline tests (no login or secrets)

# Only isolated test traffic. NEVER connects to user ChatGPT rooms,
# requests credentials, starts a browser, or modifies production.
on:
  push:
    branches:
      - feature/hitel-browserless-web2api-20261120
    paths:
      - .github/workflows/hitel-browserless-web2api-20261120.yml
      - .github/scripts/hitel_direct_http_transport.py
      - tests/test_hitel_direct_web2api.py
      - tests/test_hitel_direct_two_agents_burst.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitel-browserless-offline-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm local-only test code and no browser or account configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths=[Path('.github/scripts/hitel_direct_http_transport.py'),
                 Path('tests/test_hitel_direct_web2api.py'),
                 Path('tests/test_hitel_direct_two_agents_burst.py')]
          source='\n'.join(p.read_text('utf-8').lower() for p in paths)
          for term in ('import playwright','import selenium','connect_over_cdp(',
                       'subprocess.popen(', 'api.openai.com',
                       'secrets.', 'auth.json', 'oauth_file', '_load_credential(',
                       'getenv("gptweb_oauth', 'import hitel_direct_web2api_worker'):
              assert term not in source, 'TEST_SCOPE_VIOLATION'
          print('PASS_NO_BROWSER_NO_ACCOUNT_FILE_NO_SECRET_SETUP')
          PY
      - name: Independent room and parent state regression
        run: python3 -m unittest discover -s tests -p 'test_hitel_direct_web2api.py' -v
      - name: Both agents send overlapping real HTTP POSTs to local test server
        run: python3 -m unittest discover -s tests -p 'test_hitel_direct_two_agents_burst.py' -v
      - name: Scope statement
        if: always()
        run: |
          echo "## Strictly isolated local HTTP test" >>"$GITHUB_STEP_SUMMARY"
          echo "No user account login, no stored credentials, no browser, no new cloud resources." >>"$GITHUB_STEP_SUMMARY"
          echo "This is not evidence of successful delivery to real ChatGPT." >>"$GITHUB_STEP_SUMMARY"

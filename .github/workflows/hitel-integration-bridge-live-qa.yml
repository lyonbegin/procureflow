name: HITEL - Start Chrome API worker (manual) / Verify owner pairing

# Manual operation or a one-time source-verified upgrade on this exact workflow.
# No schedule or public dispatch; Railway dispatch remains signed and on demand.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-integration-bridge-live-qa.yml
  workflow_dispatch:
    inputs:
      operation:
        description: "Start worker only, or run an explicit account pairing / API verification"
        required: true
        type: choice
        default: worker_only
        options:
          - worker_only
          - verify_or_pair
      run_minutes:
        description: "Worker lifetime for this manual run"
        required: true
        type: choice
        default: "240"
        options:
          - "30"
          - "60"
          - "120"
          - "240"
      pairing_code:
        description: "Only needed to pair your HITEL browser; leave blank to start worker"
        required: false
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

# One-time protocol-v3 recovery after HITEL API redeployment; stale v2 workers must not block v3.
# Increment this group when the websocket/Chrome protocol is upgraded;
# do not disable job-level or Railway SQL dispatch deduplication.
concurrency:
  group: hitel-real-bridge-live-qa-protocol-v4
  cancel-in-progress: false

jobs:
  verified-chatgpt-bridge:
    name: Signed Railway API to logged-in Chrome to ChatGPT reply
    runs-on: ubuntu-24.04
    timeout-minutes: 290
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      DISPLAY: :99
      RELAY_WS_URL: wss://hitel-integration-api-production.up.railway.app/ws
      PYTHONPATH: .github/scripts
      PYTHONUNBUFFERED: "1"
      W2A_WORKER_SECONDS: ${{ inputs.run_minutes == '30' && '1800' || inputs.run_minutes == '60' && '3600' || inputs.run_minutes == '120' && '7200' || '14400' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout integration API's exact worker/client revision
        uses: actions/checkout@v4
        with:
          ref: feature/hitel-integrations-api-20261118
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Restore pre-registered encrypted account 1
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography==44.0.2 playwright==1.56.0 websockets==13.1
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          ROOT="$RUNNER_TEMP/w2a-check"
          mkdir -p "$ROOT/download"
          RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-chatgpt-encrypted-multi-profiles&per_page=50" \
            --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|reverse|.[0].workflow_run.id // empty')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT/download" >/dev/null
          test -s "$ROOT/download/registry.bin"
          test -s "$ROOT/download/account-0001.bin"
          python3 .github/scripts/w2a_profile_crypto.py restore \
            "$ROOT/download/account-0001.bin" "$ROOT"
          test -d "$ROOT/chrome-profile"
          echo PASS_EXISTING_REGISTERED_CHROME_ACCOUNT_RESTORED

      - name: Start real logged-in Chrome, assert session and registry email match
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$ROOT/chrome-profile" \
            https://chatgpt.com/ >"$ROOT/chrome.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo PASS_LIVE_CHROME_CDP_READY
              break
            fi
            if [ "$i" -eq 45 ]; then echo FAIL_CHROME_CDP_START; exit 1; fi
            sleep 2
          done
          python3 .github/scripts/w2a_verify_saved_registry.py
          echo PASS_ACCOUNT_1_LIVE_IDENTITY_REGISTRY_MATCH

      - name: Run original Web2API local adapter with pinned DOM patch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          git clone -q https://github.com/MartinezS8/chatgpt-web2api.git "$ROOT/original"
          git -C "$ROOT/original" checkout -q 497527dceabfa3f95961e23c291e618c5570f1ac
          python3 .github/scripts/w2a_patch_vendor_dom.py "$ROOT/original"
          # This is an actual, source-pinned Web2API config path. The old
          # built-in request=120s and detector=90/120s prematurely failed
          # valid long reasoning generations. Wait for verified end_turn or
          # an explicit upstream failure; never fail simply after 150s.
          # The GitHub Actions job lifetime remains the outer guard.
          mkdir -p "$HOME/.chatgpt_web2api"
          cat > "$HOME/.chatgpt_web2api/config.json" <<'W2A_WAIT_JSON'
          {
            "request_timeout": 14400,
            "detector_reasoning_first_content_timeout_seconds": 14400,
            "detector_reasoning_stream_idle_timeout_seconds": 14400,
            "detector_default_first_content_timeout_seconds": 14400,
            "detector_default_stream_idle_timeout_seconds": 14400,
            "detector_hard_timeout_seconds": 14400
          }
          W2A_WAIT_JSON
          python3 -m pip install -q "$ROOT/original"
          python3 - <<'W2A_WAIT_CHECK'
          from chatgpt_web2api.config import Config
          cfg = Config.load()
          assert cfg.server.request_timeout >= 600, "UPSTREAM_HTTP_WAIT_BELOW_10_MIN"
          assert cfg.chatgpt.detector_default_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_default_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_hard_timeout_seconds >= 600
          print("PASS_CHATGPT_ORIGINAL_WEB2API_LONG_RUNNING_WAIT_CONFIG")
          W2A_WAIT_CHECK
          chatgpt-web2api --port 18080 --host 127.0.0.1 --cdp-port 9222 \
            >"$ROOT/web2api.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo PASS_REAL_LOCAL_WEB2API_ADAPTER_HEALTH
              break
            fi
            if [ "$i" -eq 50 ]; then echo FAIL_LOCAL_WEB2API_START; exit 1; fi
            sleep 2
          done

      - name: Connect signed worker to actual Railway API WebSocket
        run: |
          set -euo pipefail
          python3 -m py_compile qa/.github/scripts/w2a_relay_worker.py
          python3 qa/.github/scripts/w2a_relay_worker.py \
            >"$RUNNER_TEMP/bridge-worker.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/bridge-worker.pid"
          for i in $(seq 1 40); do
            if grep -q PASS_GITHUB_OIDC_RELAY_WEBSOCKET_CONNECTED \
              "$RUNNER_TEMP/bridge-worker.log"; then
              echo PASS_SIGNED_GITHUB_CHROME_WORKER_NEW_RAILWAY_CONNECTED
              break
            fi
            if [ "$i" -eq 40 ]; then
              tail -n 60 "$RUNNER_TEMP/bridge-worker.log" | grep -E 'FAIL_|RELAY_CONNECTION_|ModuleNotFound|Error|Traceback|PASS_' || true
              echo FAIL_REAL_NEW_RAILWAY_WEBSOCKET
              exit 1
            fi
            sleep 2
          done

      - name: Retire known stale workers after new Chrome worker authentication
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q PASS_GITHUB_OIDC_RELAY_WEBSOCKET_CONNECTED "$RUNNER_TEMP/bridge-worker.log"
          # Exact superseded v2 run IDs only, never unrelated Actions.
          for old in 44436597201 44441066090; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$old" --jq .status)"
            if [[ "$status" == "in_progress" || "$status" == "pending" || "$status" == "queued" ]]; then
              gh run cancel "$old" --repo "$GITHUB_REPOSITORY" || true
              echo "RETIRE_SUPERSEDED_WORKER_RUN=$old"
            fi
          done

      - name: Verify account pairing or real Bearer API only when explicitly requested
        if: ${{ inputs.operation == 'verify_or_pair' || inputs.pairing_code != '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/w2a_verify_saved_registry.py
          python3 -m py_compile qa/.github/scripts/w2a_pairing_e2e.py
          python3 qa/.github/scripts/w2a_pairing_e2e.py

      - name: Keep connected worker running for the selected session
        if: ${{ (github.event_name == 'push' || inputs.operation == 'worker_only') && (github.event_name == 'push' || inputs.pairing_code == '') }}
        run: |
          set -euo pipefail
          PID="$(cat "$RUNNER_TEMP/bridge-worker.pid")"
          START="$(date +%s)"
          echo "PASS_MANUAL_WORKER_SESSION_STARTED"
          echo "WORKER_DURATION_MINUTES=${{ inputs.run_minutes }}"
          while kill -0 "$PID" 2>/dev/null; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null || true)"
            if [[ "$STATE" == Z* ]]; then
              break
            fi
            sleep 15
          done
          ELAPSED=$(( $(date +%s) - START ))
          if (( ELAPSED + 180 < W2A_WORKER_SECONDS )); then
            echo "FAIL_CHROME_WORKER_EXITED_BEFORE_REQUESTED_DURATION"
            exit 1
          fi
          echo "PASS_MANUAL_WORKER_SELECTED_SESSION_ENDED"

      - name: GitHub-signed self-restart fallback if verified jobs survive worker shutdown
        if: ${{ always() && (github.event_name == 'push' || inputs.operation == 'worker_only') }}
        run: |
          set -euo pipefail
          python3 -m py_compile qa/.github/scripts/w2a_worker_fallback.py
          python3 qa/.github/scripts/w2a_worker_fallback.py

      - name: Sanitize and summarize actual transport evidence
        if: always()
        run: |
          {
            echo '## HITEL signed HTTPS to WebSocket to real ChatGPT E2E'
            echo ''
            echo 'Manual worker-only mode stays connected for the selected session; verify_or_pair mode tests account and Bearer chat. Not evidence of continuous 24x7 service or file attachment support.'
            echo ''
            if test -f "$RUNNER_TEMP/bridge-worker.log"; then
              grep -E 'PASS_GITHUB_OIDC_RELAY_WEBSOCKET_CONNECTED|PASS_RELAY_WEB2API_JOB_RESULT_VERIFIED|FAIL_RELAY_WEB2API_JOB_|RELAY_CONNECTION_INTERRUPTED_' \
                "$RUNNER_TEMP/bridge-worker.log" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"


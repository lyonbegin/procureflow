name: HITEL - Start Chrome API worker (manual) / Verify owner pairing
run-name: HITEL Chrome worker ${{ inputs.rescue_token || 'normal' }}

# Start the consolidated runtime from this repository's default branch.
# Reuse the existing registered account and signed relay; no schedule.
on:
  # Updating this entry point starts one queued session with the latest source.
# Existing in-flight requests are allowed to finish before worker replacement.
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-integration-bridge-live-qa.yml
  workflow_dispatch:
    inputs:
      operation:
        description: "Start worker only, or run an explicit account pairing / API verification"
        required: true
        type: choice
        default: worker_only
        options:
          - worker_only
          - verify_or_pair
      run_minutes:
        description: "Worker lifetime for this manual run"
        required: true
        type: choice
        default: "240"
        options:
          - "30"
          - "60"
          - "120"
          - "240"
      pairing_code:
        description: "Only needed to pair your HITEL browser; leave blank to start worker"
        required: false
        type: string
      rescue_token:
        description: 'Stable watchdog identity for deduplicated worker launch'
        required: false
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

# One-time Web2API phase-1 timeout and vendor HTTP 500 diagnostics upgrade; signed v4 room-affine worker is required.
# Increment this group when the websocket/Chrome protocol is upgraded;
# do not disable job-level or Railway SQL dispatch deduplication.
concurrency:
  group: hitel-room-owned-tabs-worker-v4
  # Queue a new session; never cancel a worker before checking active jobs.
  cancel-in-progress: false

jobs:
  verified-chatgpt-bridge:
    name: Signed Railway API to logged-in Chrome to ChatGPT reply
    runs-on: ubuntu-24.04
    timeout-minutes: 290
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      DISPLAY: :99
      RELAY_WS_URL: wss://hitel-integration-api-production.up.railway.app/ws
      PYTHONPATH: .github/scripts
      PYTHONUNBUFFERED: "1"
      W2A_WORKER_SECONDS: ${{ github.event_name == 'push' && '14400' || inputs.run_minutes == '30' && '1800' || inputs.run_minutes == '60' && '3600' || inputs.run_minutes == '120' && '7200' || '14400' }}
    steps:
      - name: Wait for existing ChatGPT jobs to finish before switching worker
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          url="https://hitel-integration-api-production.up.railway.app/integrations/v1/public/status"
          # No job is interrupted to install the new room-capacity fix.
          # This probe does not create a request or restart another user's tab.
          while True:
              with urllib.request.urlopen(url,timeout=15) as response:
                  status=json.load(response)
              active=status.get("worker_active_jobs_count")
              if not isinstance(active,int) or isinstance(active,bool):
                  raise SystemExit("REFUSE_REPLACE_WORKER_WITH_UNKNOWN_ACTIVE_COUNT")
              if active==0:
                  print("PASS_EXISTING_WORKER_NO_ACTIVE_JOBS_SAFE_TO_REPLACE",flush=True)
                  break
              print("WAIT_EXISTING_JOBS_BEFORE_WORKER_REPLACEMENT",active,flush=True)
              time.sleep(15)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: false

      - name: Restore pre-registered encrypted account 1
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography==44.0.2 playwright==1.56.0 websockets==13.1
          # GitHub ubuntu-24.04 image already provides Xvfb. Reinstalling
          # unrelated Mesa/GBM packages made the previously signed Chrome
          # worker fail whenever the Ubuntu mirror briefly timed out.
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          fi
          command -v Xvfb
          ROOT="$RUNNER_TEMP/w2a-check"
          mkdir -p "$ROOT/download"
          RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-chatgpt-encrypted-multi-profiles&per_page=50" \
            --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|reverse|.[0].workflow_run.id // empty')"
          test -n "$RUN_ID"
          # GitHub's artifact ZIP gateway occasionally returns HTTP 503.
          # Retry ONLY this read-only artifact download; never re-send a
          # ChatGPT question or alter an account/profile.
          for attempt in $(seq 1 8); do
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT/download" >/dev/null 2>&1; then
              echo PASS_ENCRYPTED_PROFILE_ARTIFACT_DOWNLOADED
              break
            fi
            if [[ "$attempt" == "8" ]]; then
              echo FAIL_GITHUB_PROFILE_ARTIFACT_DOWNLOAD_503_OR_UNAVAILABLE
              exit 1
            fi
            echo RETRY_ONLY_ARTIFACT_READ_ATTEMPT=$attempt
            sleep 10
          done
          test -s "$ROOT/download/registry.bin"
          test -s "$ROOT/download/account-0001.bin"
          python3 .github/scripts/w2a_profile_crypto.py restore \
            "$ROOT/download/account-0001.bin" "$ROOT"
          test -d "$ROOT/chrome-profile"
          echo PASS_EXISTING_REGISTERED_CHROME_ACCOUNT_RESTORED

      - name: Start real logged-in Chrome, assert session and registry email match
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$ROOT/chrome-profile" \
            https://chatgpt.com/ >"$ROOT/chrome.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo PASS_LIVE_CHROME_CDP_READY
              break
            fi
            if [ "$i" -eq 45 ]; then echo FAIL_CHROME_CDP_START; exit 1; fi
            sleep 2
          done
          python3 .github/scripts/w2a_verify_saved_registry.py
          echo PASS_ACCOUNT_1_LIVE_IDENTITY_REGISTRY_MATCH

      - name: Run original Web2API local adapter with pinned DOM patch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          git clone -q https://github.com/MartinezS8/chatgpt-web2api.git "$ROOT/original"
          git -C "$ROOT/original" checkout -q 497527dceabfa3f95961e23c291e618c5570f1ac
          python3 .github/scripts/w2a_patch_vendor_dom.py "$ROOT/original"
          python3 .github/scripts/w2a_patch_vendor_composer_20261120.py "$ROOT/original"
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/api_server.py").read_text()
          assert 'new_conversation = body.get("new_conversation") is True' in source, "NEW_ROOM_FORCE_NEW_CHAT_PATCH_MISSING"
          assert '"code": type(exc).__name__' in source, "VENDOR_SAFE_ERROR_CLASS_PATCH_MISSING"
          assert 'await self._driver.ensure_current_conversation(conversation_id)' in source, "VENDOR_NO_RELOAD_PATCH_MISSING"
          assert 'self._driver._current_conv_id = conversation_id' in source, "VENDOR_ROOM_BINDING_PATCH_MISSING"
          print("PASS_PINNED_VENDOR_CURRENT_PATCH_VERIFIED")
          detector=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/completion_detector.py").read_text()
          assert "DOM_VERIFIED_NEW_ASSISTANT_COMPLETED" in detector, "WEB2API_DOM_PROOF_PATCH_MISSING"
          assert "backend_observation_key" in detector, "WEB2API_PROJECTION_POLL_PATCH_MISSING"
          assert "backend_retry_at" in detector, "WEB2API_READ_ONLY_RETRY_MISSING"
          assert "verified_user.get('match') is True" in detector, "WEB2API_NEW_USER_CORRELATION_MISSING"
          assert "HITEL_W2A_STAGE=ASSISTANT_SEEN" in detector, "WEB2API_BROWSER_STAGE_MISSING"
          assert "time.monotonic() - last_backend_check > 3.0" not in detector, "WEB2API_PROJECTION_READ_STORM_NOT_REMOVED"
          assert "and not has_action" in detector, "WEB2API_DOM_ACTION_READ_SUPPRESSION_MISSING"
          driver=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/cdp_driver.py").read_text()
          assert "self._completion.dom_completion_verified" in driver, "WEB2API_REDUNDANT_RECONCILIATION_NOT_REMOVED"
          assert "HITEL_W2A_STAGE=SEND_DISPATCHED" in driver, "WEB2API_SEND_STAGE_MISSING"
          assert "full_text = await _send_and_collect()  # no automatic resend" in source, "WEB2API_SEND_REPLAY_NOT_DISABLED"
          print("PASS_INSTALLED_WEB2API_DOM_PROJECTION_READ_FIX_NO_CHAT_SEND_RETRY")
          PY
          # This is an actual, source-pinned Web2API config path. The old
          # built-in request=120s and detector=90/120s prematurely failed
          # valid long reasoning generations. Wait for verified end_turn or
          # an explicit upstream failure; never fail simply after 150s.
          # The GitHub Actions job lifetime remains the outer guard.
          mkdir -p "$HOME/.chatgpt_web2api"
          cat > "$HOME/.chatgpt_web2api/config.json" <<'W2A_WAIT_JSON'
          {
            "request_timeout": 14400,
            "tab_mode": "owned",
            "parallel_tabs": true,
            "detector_reasoning_first_content_timeout_seconds": 14400,
            "detector_reasoning_stream_idle_timeout_seconds": 14400,
            "detector_default_first_content_timeout_seconds": 14400,
            "detector_default_stream_idle_timeout_seconds": 14400,
            "detector_hard_timeout_seconds": 14400
          }
          W2A_WAIT_JSON
          # Assert the exact runnable source contains the confirmed live
          # ChatGPT role=textbox composer selector after both pinned patches.
          python3 - <<'W2A_SELECTOR_CHECK'
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/chatgpt_dom.py"
          source=p.read_text("utf-8")
          if source.count('[role="textbox"][contenteditable="true"]')!=1:
              raise SystemExit("FAIL_RUNTIME_EDITOR_SELECTOR_NOT_INSTALLED")
          print("PASS_CURRENT_LIVE_EDITOR_SELECTOR_PRESENT_IN_INSTALLED_VENDOR_SOURCE")
          W2A_SELECTOR_CHECK
          python3 -m pip install -q "$ROOT/original"
          python3 - <<'W2A_WAIT_CHECK'
          from chatgpt_web2api.config import Config
          cfg = Config.load()
          assert cfg.server.request_timeout >= 600, "UPSTREAM_HTTP_WAIT_BELOW_10_MIN"
          assert cfg.chatgpt.detector_default_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_default_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_hard_timeout_seconds >= 600
          assert cfg.chatgpt.tab_mode == 'owned'
          assert cfg.chatgpt.parallel_tabs is True
          print("PASS_CHATGPT_ORIGINAL_WEB2API_LONG_RUNNING_WAIT_CONFIG")
          W2A_WAIT_CHECK
          # Per-room vendor instances are started by the authenticated worker,
          # not by the workflow. No shared singleton browser tab in normal mode.
          if [[ "${{ inputs.operation }}" == "verify_or_pair" ]]; then
            chatgpt-web2api --port 18080 --host 127.0.0.1 --cdp-port 9222 \
              >"$ROOT/web2api.log" 2>&1 &
            for i in $(seq 1 50); do
              if curl -fsS --max-time 5 http://127.0.0.1:18080/health >/dev/null 2>&1; then
                echo PASS_PAIRING_ONLY_LOCAL_WEB2API_HEALTH
                break
              fi
              if [ "$i" -eq 50 ]; then echo FAIL_PAIRING_LOCAL_WEB2API_START; exit 1; fi
              sleep 2
            done
          else
            echo PASS_LAZY_PER_ROOM_OWNED_TAB_WORKER_CONFIGURATION
          fi

      - name: Connect signed worker to actual Railway API WebSocket
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/hitel_web2api_worker.py
          python3 -m py_compile .github/scripts/hitel_room_tab_pool.py
          grep -q '"hitel_protocol_version":4' .github/scripts/hitel_web2api_worker.py
          echo PASS_EXACT_SIGNED_ROOM_TAB_WORKER_V4
          date +%s >"$RUNNER_TEMP/bridge-worker.started-at"
          python3 .github/scripts/hitel_web2api_worker.py \
            >"$RUNNER_TEMP/bridge-worker.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/bridge-worker.pid"
          for i in $(seq 1 210); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/bridge-worker.pid")" 2>/dev/null; then
              grep -E 'REFUSE_|FAIL_|PASS_PINNED_VENDOR_|Traceback|RuntimeError' \
                "$RUNNER_TEMP/bridge-worker.log" | tail -n 20 || true
              echo FAIL_SIGNED_WORKER_PROCESS_EXITED_BEFORE_PREWARM
              exit 1
            fi
            if grep -q 'PASS_AUTHENTICATED_ROOM_TAB_PREWARM=2/2' \
              "$RUNNER_TEMP/bridge-worker.log"; then
              STATE="$(curl --max-time 6 -fsS \
                https://hitel-integration-api-production.up.railway.app/integrations/v1/public/status \
                | python3 -c 'import json,sys; x=json.load(sys.stdin); print(int(x.get("worker_bootstrap_ready") is True and x.get("prewarmed_room_count")==2))' \
                2>/dev/null || echo 0)"
              if [[ "$STATE" == "1" ]]; then
                echo PASS_TWO_EXISTING_CHATGPT_ROOMS_PREWARMED_IN_INDEPENDENT_TABS
                break
              fi
            fi
            if grep -Eq 'RELAY_CONNECTION_INTERRUPTED|RELAY_WEBSOCKET_LIFETIME_EXPIRED' \
              "$RUNNER_TEMP/bridge-worker.log"; then
              grep -E 'FAIL_ROOM_TAB_PREWARM|RELAY_CONNECTION_INTERRUPTED' \
                "$RUNNER_TEMP/bridge-worker.log" || true
              echo FAIL_EXISTING_ROOM_TAB_PREWARM_TRANSPORT
              exit 1
            fi
            if grep -q 'PASS_AUTHENTICATED_ROOM_TAB_PREWARM=' \
              "$RUNNER_TEMP/bridge-worker.log" && ! grep -q 'PASS_AUTHENTICATED_ROOM_TAB_PREWARM=2/2' \
              "$RUNNER_TEMP/bridge-worker.log"; then
              grep -E 'FAIL_ROOM_TAB_PREWARM|PASS_AUTHENTICATED_ROOM_TAB_PREWARM=' \
                "$RUNNER_TEMP/bridge-worker.log" || true
              echo FAIL_EXISTING_ROOM_TAB_PREWARM_VERIFIED_INCOMPLETE
              exit 1
            fi
            if [ "$i" -eq 210 ]; then
              tail -n 45 "$RUNNER_TEMP/bridge-worker.log" | grep -E 'FAIL_|PASS_|RELAY_CONNECTION_' || true
              echo FAIL_TWO_ROOM_TAB_PREWARM_VERIFICATION
              exit 1
            fi
            sleep 2
          done

      - name: Verify account pairing or real Bearer API only when explicitly requested
        if: ${{ inputs.operation == 'verify_or_pair' || inputs.pairing_code != '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/w2a_verify_saved_registry.py
          python3 -m py_compile .github/scripts/w2a_pairing_e2e.py
          python3 .github/scripts/w2a_pairing_e2e.py

      - name: Keep connected worker running for the selected session
        if: ${{ (github.event_name == 'push' || inputs.operation == 'worker_only') && (github.event_name == 'push' || inputs.pairing_code == '') }}
        run: |
          set -euo pipefail
          PID="$(cat "$RUNNER_TEMP/bridge-worker.pid")"
          START="$(cat "$RUNNER_TEMP/bridge-worker.started-at")"
          RESTARTS=0
          MISSED=0
          echo "PASS_CHROME_WORKER_WATCHDOG_SESSION_STARTED"
          echo "WORKER_DURATION_SECONDS=$W2A_WORKER_SECONDS"
          # The process can remain alive even after losing its signed socket.
          # A real /status heartbeat, not PID existence, decides liveness.
          # Never enqueue or replay a ChatGPT prompt from this watchdog.
          while (( $(date +%s) - START < W2A_WORKER_SECONDS - 30 )); do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null || true)"
            if ! kill -0 "$PID" 2>/dev/null || [[ "$STATE" == Z* ]]; then
              MISSED=3
            else
              HEALTH="$(curl --max-time 10 -fsS                 https://hitel-integration-api-production.up.railway.app/integrations/v1/public/status 2>/dev/null                 | python3 -c 'import json,sys; x=json.load(sys.stdin); print(int(x.get("worker_connected") is True and x.get("worker_heartbeat_recent") is True))'                 2>/dev/null || echo 0)"
              if [[ "$HEALTH" == "1" ]]; then MISSED=0; else MISSED=$(( MISSED + 1 )); fi
            fi
            if (( MISSED >= 3 )); then
              if (( RESTARTS >= 4 )); then
                echo "FAIL_SIGNED_CHROME_WORKER_HEARTBEAT_RECOVERY_EXHAUSTED"
                exit 1
              fi
              echo "RECOVER_CHROME_WORKER_DISCONNECTED_ATTEMPT=$(( RESTARTS + 1 ))"
              kill "$PID" 2>/dev/null || true
              sleep 3
              python3 .github/scripts/hitel_web2api_worker.py                 >>"$RUNNER_TEMP/bridge-worker.log" 2>&1 &
              PID=$!
              echo "$PID" > "$RUNNER_TEMP/bridge-worker.pid"
              RESTARTS=$(( RESTARTS + 1 ))
              MISSED=0
              # Allow signed WebSocket re-authentication before the next probes.
              sleep 25
            else
              sleep 15
            fi
          done
          echo "PASS_CHROME_WORKER_SESSION_WATCHDOG_COMPLETED"

      - name: Sanitize and summarize actual transport evidence
        if: always()
        run: |
          {
            echo '## HITEL signed HTTPS to WebSocket to real ChatGPT E2E'
            echo ''
            echo 'Manual worker-only mode stays connected for the selected session; verify_or_pair mode tests account and Bearer chat. Not evidence of continuous 24x7 service or file attachment support.'
            echo ''
            if test -f "$RUNNER_TEMP/bridge-worker.log"; then
              grep -E 'PASS_GITHUB_OIDC_RELAY_WEBSOCKET_CONNECTED|PASS_AUTHENTICATED_ROOM_TAB_PREWARM|PASS_RELAY_WEB2API_JOB_RESULT_VERIFIED|FAIL_RELAY_WEB2API_JOB_|RELAY_CONNECTION_INTERRUPTED_' \
                "$RUNNER_TEMP/bridge-worker.log" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"


# STOCKTV 2026-11-21: queue one existing main Web2API worker after prior runner exits; no active job preemption.


  # Secondary safety net: reserve the NEXT four-hour worker in GitHub's
  # non-cancelling queue even if the five-minute cron scheduler is delayed.
  worker_session_successor:
    needs: verified-chatgpt-bridge
    if: ${{ always() && (github.event_name == 'push' || inputs.operation == 'worker_only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Queue exactly one successor after completed or failed worker session
        env:
          GH_TOKEN: ${{ github.token }}
          HITEL_WORKER_AFTER_SESSION: "1"
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/hitel_worker_rescue.py
          PYTHONPATH=.github/scripts python3 .github/scripts/test_hitel_worker_rescue.py
          python3 .github/scripts/hitel_worker_rescue.py

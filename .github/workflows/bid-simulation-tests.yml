name: Bid Simulation Contract Tests
on:
  push:
    paths:
      - 'bid_simulation.py'
      - 'workbench.py'
      - 'agent_orchestrator.py'
      - 'static/agents.html'
      - 'tests/test_agent_activation.py'
      - 'static/workbench.html'
      - 'tests/test_workbench.py'
      - 'bid_price_engine.py'
      - 'static/bid_prepare.html'
      - 'tests/test_bid_price_engine.py'
      - 'main.py'
      - 'tests/test_bid_simulation.py'
      - 'browser_diagnostics.py'
      - 'tests/test_browser_diagnostics.py'
      - '.github/workflows/bid-simulation-tests.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_bid_simulation.py tests/test_browser_diagnostics.py tests/test_bid_price_engine.py tests/test_workbench.py tests/test_agent_activation.py -q
      - run: python -m py_compile bid_simulation.py bid_price_engine.py browser_diagnostics.py workbench.py agent_orchestrator.py db.py main.py worker.py

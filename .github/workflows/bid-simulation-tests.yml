name: Bid Simulation Contract Tests
on:
  push:
    paths:
      - 'bid_simulation.py'
      - 'main.py'
      - 'tests/test_bid_simulation.py'
      - 'browser_diagnostics.py'
      - 'tests/test_browser_diagnostics.py'
      - '.github/workflows/bid-simulation-tests.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_bid_simulation.py tests/test_browser_diagnostics.py -q
      - run: python -m py_compile bid_simulation.py browser_diagnostics.py db.py main.py worker.py

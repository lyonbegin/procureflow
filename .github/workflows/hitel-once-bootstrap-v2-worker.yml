name: HITEL one-time obsolete Chrome worker and pending duplicate cleanup

on:
  push:
    branches: [feature/hitel-integrations-api-20261118]
    paths:
      - ".github/workflows/hitel-once-bootstrap-v2-worker.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup-obsolete-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel old v1 and duplicate pending runs; preserve active verified v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The real four-turn A-A-B-A live test passed with the active v2 run
          # 44436597201. Keep that run completely untouched.
          KEEP=44436597201
          for id in 44436200860 44436865071 44427600999; do
            state="$(gh api "repos/lyonbegin/procureflow/actions/runs/$id" --jq '.status')"
            if [[ "$state" == "queued" || "$state" == "pending" || "$state" == "in_progress" ]]; then
              gh api -X POST "repos/lyonbegin/procureflow/actions/runs/$id/cancel" >/dev/null
              echo "PASS_OBSOLETE_OR_DUPLICATE_RUN_CANCEL_REQUESTED id=$id"
            else
              echo "SKIP_ALREADY_TERMINAL_RUN id=$id state=$state"
            fi
          done
          active="$(gh api "repos/lyonbegin/procureflow/actions/runs/$KEEP" --jq '.status')"
          test "$active" == "in_progress"
          echo "PASS_VERIFIED_V2_RUN_PRESERVED"

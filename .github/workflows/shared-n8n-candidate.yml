name: Shared official n8n + ProcureFlow full workflow candidate (isolated)
on:
  pull_request:
    paths:
      - 'n8n/source-build/Dockerfile.shared-studio-candidate'
      - 'n8n/source-build/bootstrap-workflows.sh'
      - 'n8n/source-build/compile-native-topology.mjs'
      - '.github/workflows/shared-n8n-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-studio-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate preserves isolated release boundary
        run: |
          grep -F 'SHARED_N8N_STUDIO_COMMIT=999062f1676bdffafa852a36e6c986ef5ce7589f' n8n/source-build/Dockerfile.shared-studio-candidate
          grep -F 'N8N_SOURCE_SHA=b58d9e89d60e9a3485bb511c5091d8be0d9511e4' n8n/source-build/Dockerfile.shared-studio-candidate
          grep -F 'procureflow-n8n-bootstrap' n8n/source-build/Dockerfile.shared-studio-candidate
          grep -F 'apply-pan-patch.mjs' n8n/source-build/Dockerfile.shared-studio-candidate
      - name: Build full official n8n 2.44.6 with pinned shared studio
        run: |
          set -o pipefail
          docker build --progress=plain \
            -f n8n/source-build/Dockerfile.shared-studio-candidate \
            -t pf-shared-studio-candidate:${{ github.sha }} . 2>&1 | tee candidate-build.log
          grep -F 'PAN_PATCH_PATCHED:' candidate-build.log
      - name: Pin official n8n executable version
        run: |
          docker run --rm --entrypoint n8n pf-shared-studio-candidate:${{ github.sha }} --version | tee candidate-version.log
          grep -Fx '2.44.6' candidate-version.log
      - name: Start isolated candidate and import 26 PF/S workflows
        run: |
          docker run -d --rm --name pf-shared-candidate \
            --publish 127.0.0.1:5681:5678 \
            --env DB_TYPE=sqlite \
            --env N8N_LISTEN_ADDRESS=0.0.0.0 \
            --env N8N_SECURE_COOKIE=false \
            --env N8N_ENCRYPTION_KEY=procureflow-isolated-candidate-test-only-key-2026 \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_PERSONALIZATION_ENABLED=false \
            --env N8N_TEMPLATES_ENABLED=false \
            --env N8N_RUNNERS_ENABLED=false \
            pf-shared-studio-candidate:${{ github.sha }}
          for i in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:5681/healthz/readiness; then
              echo "SHARED_STUDIO_CANDIDATE_READY"
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx pf-shared-candidate; then
              docker logs pf-shared-candidate || true
              exit 1
            fi
            sleep 2
          done
          docker logs pf-shared-candidate || true
          exit 1
      - name: Inspect actual isolated SQLite workflow imports via native n8n CLI
        run: |
          docker exec --user node pf-shared-candidate n8n export:workflow --all --output=/tmp/pf-candidate-workflows.json
          docker cp pf-shared-candidate:/tmp/pf-candidate-workflows.json ./candidate-workflows.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('candidate-workflows.json'));
          const workflows=Array.isArray(raw)?raw:raw.data;
          if(!Array.isArray(workflows))throw Error('Unexpected n8n export shape');
          const ids=workflows.map(x=>x.id);
          const required=['PFORCH2026MAINWF',
             ...Array.from({length:15},(_,i)=>'PFOP2026PF'+String(i+1).padStart(2,'0')+'WF'),
             ...Array.from({length:10},(_,i)=>'PFDEMO2026S'+String(i+1).padStart(2,'0')+'WF')];
          for(const id of required)if(!ids.includes(id))throw Error('Missing imported official n8n workflow '+id);
          if(new Set(ids).size!==ids.length)throw Error('Duplicate native n8n IDs');
          if(required.length!==26)throw Error('Incorrect expected count');
          console.log('OFFICIAL_NATIVE_PF_IMPORT_PASS',JSON.stringify({workflows:ids.length,required:required.length}));
          NODE
      - name: Inspect exact custom-node copy and n8n extension loader configuration
        run: |
          docker exec pf-shared-candidate sh -lc 'echo N8N_CUSTOM_EXTENSIONS="$N8N_CUSTOM_EXTENSIONS"; ls -al /home/node/procureflow-custom-nodes/; node -e "const s=require(\x27/home/node/procureflow-custom-nodes/ProcureFlowBusinessOperation.node.js\x27);const n=new s.ProcureFlowBusinessOperation();console.log(\x27CUSTOM_NODE_LOCAL_OK\x27,n.description.name,n.description.properties[0].options.length)"'
      - name: Verify Business Operation native n8n node registration and 43 UI choices
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base='http://127.0.0.1:5681';
          let cookie='';
          async function request(method,path,data){
            const res=await fetch(base+path,{method,headers:{
              ...(cookie?{Cookie:cookie}:{}),
              ...(data!==undefined?{'Content-Type':'application/json'}:{})
            },...(data!==undefined?{body:JSON.stringify(data)}:{})});
            const raw=res.headers.getSetCookie?.()||[res.headers.get('set-cookie')||''];
            for(const v of raw){
              const m=v.match(/n8n-auth=[^;]+/);
              if(m)cookie=m[0];
            }
            const body=await res.json().catch(()=>({}));
            if(!res.ok)throw Error(method+' '+path+' HTTP '+res.status()+' '+JSON.stringify(body).slice(0,350));
            return body;
          }
          (async()=>{
            const settings=await request('GET','/rest/settings');
            if(settings.data?.userManagement?.showSetupOnFirstLoad){
              await request('POST','/rest/owner/setup',
                {email:'candidate@example.invalid',firstName:'Candidate',lastName:'Test',password:'CandidatePass123!'});
            }
            await request('POST','/rest/login',
              {emailOrLdapLoginId:'candidate@example.invalid',password:'CandidatePass123!'});
            const result=await request('POST','/rest/node-types',
              {nodeInfos:[{name:'CUSTOM.procureFlowBusinessOperation',version:1}]});
            console.log('CUSTOM_NODE_API_PAYLOAD',JSON.stringify(result).slice(0,5000));
            const list=Array.isArray(result.data)?result.data:Array.isArray(result)?result:
              Array.isArray(result.data?.data)?result.data.data:[];
            if(!list.some(n=>n?.name==='CUSTOM.procureFlowBusinessOperation')){
              console.error('CUSTOM_NODE_REGISTRY_DIAGNOSTIC',JSON.stringify({rows:list.length,names:list.map(x=>x?.name||null)}));
            }
            const node=list.find(n=>n?.name==='CUSTOM.procureFlowBusinessOperation');
            assert(node,'Official n8n did not register ProcureFlow Business Operation custom node');
            const opts=node.properties?.find(x=>x.name==='operationId')?.options||[];
            assert.equal(opts.length,43,'Missing native 43-operation options');
            assert.deepEqual(node.outputNames,['success','hold_or_error']);
            console.log('OFFICIAL_N8N_BUSINESS_OPERATION_REGISTERED',JSON.stringify({
              type:node.name,operations:opts.length,ports:node.outputNames
            }));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Save no-credential candidate evidence
        if: always()
        run: docker logs pf-shared-candidate > candidate-runtime.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-shared-n8n-pf-candidate
          path: |
            candidate-build.log
            candidate-version.log
            candidate-runtime.log
            candidate-workflows.json

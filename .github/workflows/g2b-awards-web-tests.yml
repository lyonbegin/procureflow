name: G2B Final Award Web Contracts
on:
  push:
    branches: [main]
    paths:
      - "g2b_bid_collector.py"
      - "g2b_award_web_collector.py"
      - "g2b_final_award_collector.py"
      - "tests/test_g2b_bid_collector.py"
      - "tests/test_g2b_final_award_collector.py"
      - ".github/workflows/g2b-awards-web-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2b_final_award_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile collector modules
        run: python -m py_compile g2b_bid_collector.py g2b_award_web_collector.py g2b_final_award_collector.py
      - name: Check confirmed award evidence and bidder separation
        run: python -m unittest discover -s tests -p 'test_g2b_*.py' -v

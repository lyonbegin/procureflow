name: Genuine ChatGPT x86_64 original artifact - real app relay E2E
on:
  push:
    branches: [test/relay-success-apk-baseline-20261111, fix/relay-official-file-login-gate-20261111]
    paths:
      - .github/workflows/verify-real-chatgpt-from-verified-x86-artifact.yml
      - .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
      - .github/scripts/probe-official-chatgpt-guest-send.sh
      - .github/scripts/relay-live-android-api.py
      - chatgpt-android-relay/android/**
      - chatgpt-android-relay/web/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-official-chatgpt-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate actual UI test syntax
        run: |
          bash -n .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
          python3 -m py_compile .github/scripts/relay-live-android-api.py
      - name: Install isolated server dependencies
        run: python3 -m pip install -r chatgpt-android-relay/web/requirements.txt
      - name: Allow only emulator host-gateway WebSocket in this transient CI build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatgpt-android-relay/android/app/src/main/java/com/hitel/chatrelay/ChatRelayService.kt')
          s=p.read_text()
          a='if (!url.startsWith("wss://") || !url.endsWith("/ws") || token.length < 12) {'
          b='if (!(url.startsWith("wss://") || url == "ws://10.0.2.2:8765/ws") || !url.endsWith("/ws") || token.length < 12) {'
          assert s.count(a)==1, 'unexpected original WebSocket validation'
          s=s.replace(a,b)
          a='.replaceFirst("wss://", "https://").removeSuffix("/ws")'
          b='.replaceFirst("wss://", "https://").replaceFirst("ws://10.0.2.2:", "http://10.0.2.2:").removeSuffix("/ws")'
          assert s.count(a)==1, 'unexpected attachment URL mapping'
          s=s.replace(a,b)
          p.write_text(s)
          print('PASS_ONLY_GITHUB_EMULATOR_HOST_GATEWAY_ENABLED')
          PY
      - name: Build Android accessibility controller
        run: |
          set -euo pipefail
          gradle --no-daemon -p chatgpt-android-relay/android :app:assembleDebug
          sha256sum chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Restore pinned exact original from successful verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-artifact /tmp/chatgpt-original-splits real-chatgpt-evidence
          gh run download 43007675195 \
            --repo lyonbegin/procureflow \
            --name exact-original-chatgpt-2630015-x86_64 \
            --dir /tmp/original-artifact
          test -s /tmp/original-artifact/official-user-original.apkm
          cp /tmp/original-artifact/official-user-original.apkm /tmp/official-user-original.apkm
          test "$(stat -c %s /tmp/official-user-original.apkm)" -eq 101098896
          printf '%s\n' '695598014d4db8ef284a7171bf9f6382fff5629aba2c9960b710d539b4fe2b44  /tmp/official-user-original.apkm' \
            | sha256sum -c | tee real-chatgpt-evidence/original-apkm-verified.txt
          unzip -tq /tmp/official-user-original.apkm | tee real-chatgpt-evidence/original-apkm-integrity.txt
          unzip -j -q /tmp/official-user-original.apkm \
            base.apk split_config.x86_64.apk split_config.xxhdpi.apk split_config.en.apk split_config.ko.apk \
            -d /tmp/chatgpt-original-splits
          ls -lh /tmp/chatgpt-original-splits | tee real-chatgpt-evidence/verified-original-splits.txt
          echo EXACT_USER_ORIGINAL_APKM_READY_FROM_VERIFIED_GITHUB_ARTIFACT
      - name: Grant KVM for real Android emulator
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - name: Install original official APKM plus controller and execute actual send/reply/attachments
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 650
          script: bash .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-official-chatgpt-2026-300-e2e-evidence
          path: real-chatgpt-evidence/
          if-no-files-found: warn

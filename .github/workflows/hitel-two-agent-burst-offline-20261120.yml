name: HITEL two independent agents concurrent HTTP burst (isolated QA)

# 70 real loopback HTTP POSTs from two different agents, each its own room.
# Replies are generated by a local deterministic TEST SERVER, NOT ChatGPT.
# Production A/Scribd room IDs are never used; no credentials or Chrome.
on:
  push:
    branches:
      - feature/hitel-browserless-web2api-20261120
    paths:
      - .github/workflows/hitel-two-agent-burst-offline-20261120.yml
      - tests/test_hitel_direct_two_agents_burst.py
      - .github/scripts/hitel_direct_http_transport.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-agent-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run two-room real HTTP concurrency + error-injection tests (no ChatGPT)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_hitel_direct_two_agents_burst.py' -v
      - name: Distinguish transport simulation from actual ChatGPT verification
        if: always()
        run: |
          echo "## HITEL two-agent HTTP isolation" >> "$GITHUB_STEP_SUMMARY"
          echo "This runs 70 REAL HTTP POSTs to a local deterministic mock only." >> "$GITHUB_STEP_SUMMARY"
          echo "No Chrome; no external ChatGPT requests; no A/Scribd operating room mutations." >> "$GITHUB_STEP_SUMMARY"
          echo "Result cannot certify LIVE ChatGPT concurrency; live test requires verified OAuth." >> "$GITHUB_STEP_SUMMARY"

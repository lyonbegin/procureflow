name: ProcureFlow collection-first N01-N08, N09 AI-only verification
on:
  push:
    branches: [feature/procureflow-unified-studio-20261107]
    paths:
      - .github/workflows/collection-first-nine.yml
      - n8n/unified/collect_only_stages.py
      - n8n/unified/n09_final_ai.py
      - n8n/unified/github_node_worker.py
      - n8n/unified/github_actions_bridge.py
      - n8n/strategy-workflows/PF00-public-nine-real.json
      - tests/test_collection_first_nine.py
      - tests/test_github_action_node_migration.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Railway OIDC verifier test dependency (GitHub runner only)
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]==2.10.1'
      - name: Validate no business judgments before N09 and preserved graph
        run: |
          python -m unittest discover -s tests -p test_collection_first_nine.py -v
          python -m unittest discover -s tests -p test_github_action_node_migration.py -v
      - name: Python compile + browser dependency boundary
        run: |
          python -m py_compile n8n/unified/collect_only_stages.py n8n/unified/n09_final_ai.py n8n/unified/github_node_worker.py n8n/unified/github_actions_bridge.py
          echo 'COLLECTION_FIRST_N01_N08_N09_ONLY_AI_CONTRACT_PASS'
  g2b-selected-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real G2B selected tender lookup (N03 source fields, not eligibility)
        run: |
          python - <<'PY'
          import json,sys
          from datetime import date
          sys.path.insert(0,'n8n/unified')
          import live_nine_test as live
          from collect_only_stages import n03_metadata
          notice={"bid_no":"R26BK01816186","bid_ord":"000"}
          opener=live._client()
          live._once(opener)
          status,out=n03_metadata(opener,notice,live._json_post,live,date(2026,11,8))
          print("COLLECTION_FIRST_REAL_G2B_METADATA",json.dumps({
              "stage":"N03","status":status,
              "selected_record_found":out["official_selected_record_found"],
              "detail10":out["detail10"],
              "detail10_source_field":out["detail10_source_field"],
              "source_keys":list(out["official_fields"]),
              "gaps":out["gaps"],
              "business_evaluation_performed":out["business_evaluation_performed"],
          },ensure_ascii=False),flush=True)
          assert out["selected_bid_no"]==notice["bid_no"]
          assert out["business_evaluation_performed"] is False
          assert "company_eligibility" not in out
          assert status in ("verified","partial")
          print("COLLECTION_FIRST_REAL_G2B_N03_NO_EVALUATION_PASS",flush=True)
          PY
      - name: Probe actual N04 broad search filters (read-only)
        run: |
          python - <<'PY'
          import sys,json
          from datetime import date
          sys.path.insert(0,'n8n/unified')
          import live_nine_test as live
          from collect_only_stages import BID_LIST,BID_HEADERS,n03_metadata
          opener=live._client();live._once(opener)
          _,record=n03_metadata(opener,{"bid_no":"R26BK01816186","bid_ord":"000"},
                               live._json_post,live,date(2026,11,8))
          fields=record["official_fields"]
          searches=[
             ("agency_code","oderInstUntyGrpNo",fields.get("oderInstUntyGrpNo")),
             ("agency_name","dmstNm",fields.get("dmstNm")),
             ("title_short","bidPbancNm",(fields.get("bidPbancNm") or "")[:10]),
          ]
          for name,key,val in searches:
             if not val:continue
             payload=live._g2b_bid_list_payload("20251108","20261108",page=1)
             payload["dlBidPbancLstM"][key]=val
             try:
                rows=live._json_post(opener,BID_LIST,payload,BID_HEADERS)
                print("N04_LIVE_FILTER_PROBE",json.dumps({
                    "mode":name,"valid_list":isinstance(rows,list),
                    "rows":len(rows) if isinstance(rows,list) else None,
                    "matched_field":sum(1 for row in rows if isinstance(row,dict) and
                        str(row.get(key) or "").strip()==str(val).strip()) if isinstance(rows,list) else None,
                    "matched_agency":sum(1 for row in rows if isinstance(row,dict) and
                        row.get("dmstNm")==fields.get("dmstNm")) if isinstance(rows,list) else None,
                    "example_key_names":list(rows[0].keys())[:14] if isinstance(rows,list) and rows else []
                },ensure_ascii=False),flush=True)
             except Exception as error:
                print("N04_LIVE_FILTER_PROBE",json.dumps({
                    "mode":name,"error":type(error).__name__+":"+str(error)[:80]
                }),flush=True)
          from collect_only_stages import n04_history
          state,history=n04_history(opener,
              {"bid_no":"R26BK01816186","bid_ord":"000"},
              record,live._json_post,live,date(2026,11,8),max_pages=3)
          print("N04_LIVE_HISTORY",json.dumps({
              "status":state,"query_mode":history["query_mode"],
              "periods_checked":len(history["periods_checked"]),
              "initial_years":history.get("initial_years"),
              "years_expanded":history.get("years_expanded"),
              "target_records":history.get("target_records"),
              "target_reached":history.get("target_reached"),
              "scan_page_cap":3,
              "responses":history["total_responses"],
              "candidate_records":history.get("candidate_record_count"),
              "verified_records":history.get("verified_record_count"),
              "source_gaps":history["gaps"][:5],
              "evaluation_performed":history["business_evaluation_performed"],
          },ensure_ascii=False),flush=True)
          assert 3<=len(history["periods_checked"])<=10
          assert history["total_responses"]>0
          assert history["business_evaluation_performed"] is False
          from collect_only_stages import n05_openings
          if history.get("records"):
             # N04 is tested across the full policy; limit this separate N05
             # smoke to one source-backed sample so CI does not perform 50
             # independent full bidder-detail requests.
             n05_sample={**history,"records":history["records"][:1]}
             status5,opening=n05_openings(opener,n05_sample,live._json_post,date(2026,11,8))
             print("N05_LIVE_HISTORY_OPENING",json.dumps({
                 "status":status5,
                 "history_candidates":opening.get("candidates"),
                 "smoke_sample_limit":1,
                 "checked":opening.get("checked"),
                 "opening_records":len(opening.get("opening_records") or []),
                 "bidder_detail_documents":len(opening.get("bidder_detail_records") or []),
                 "actual_bidder_rows":sum(len(d.get("bidders") or [])
                     for d in opening.get("bidder_detail_records") or []),
                 "not_published_or_not_returned":opening.get("not_published_count"),
                 "per_notice":opening.get("per_notice",[])[:1],
                 "gaps":opening.get("gaps",[])[:10],
                 "source_notice_ids":[x.get("bid_no") for x in history["records"][:3]],
                 "evaluation_performed":opening.get("business_evaluation_performed")
             },ensure_ascii=False),flush=True)
             assert opening["business_evaluation_performed"] is False
          PY

  g2b-opening-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe real G2B opening listing, real row keys and read-only bidder detail
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'n8n/unified')
          import live_nine_test as live
          from collect_only_stages import (OPENING_LIST,OPEN_HEADERS,
                  _n05_bidder_details)
          opener=live._client()
          live._once(opener)
          form={"dlSrchOnbsRsltClsfListInM":{
              "bidPbancNo":"","bidPbancOrd":"","bidPbancNm":"",
              "onbsYmdStr":"20261001","onbsYmdEnd":"20261108",
              "prcmBsneSeCd":"0000 조070001 조070002 조070003 조070004 조070005",
              "frcpYn":"Y","rsrvYn":"Y","laseYn":"Y","chkBsneAllYn":"Y",
              "firstIndex":1,"lastIndex":10,"inqEnd":"","stepBarYn":"",
              "pbancKndCd":"공440002"}}
          try:
              rows=live._json_post(opener,OPENING_LIST,form,OPEN_HEADERS)
              if not isinstance(rows,dict):raise ValueError("opening-list response not dictionary")
              entries=rows.get("onbsRsltClsfList")
              if not isinstance(entries,list):raise ValueError("opening-list entries missing")
              print("N05_OFFICIAL_LIST_PROBE",json.dumps({
                  "rows":len(entries),
                  "first_row_fields":sorted(entries[0].keys()) if entries else []
              },ensure_ascii=False),flush=True)
              needed=("bidPbancNo","bidPbancOrd","bidClsfNo",
                      "bidPrgrsOrd","prcmBsneSeCd","bidPgstCd")
              for item in entries[:3]:
                  if not isinstance(item,dict):continue
                  print("N05_OFFICIAL_DETAIL_KEYS",json.dumps({
                      "bid_no":item.get("bidPbancNo"),
                      "source_values":{k:item.get(k) for k in needed if k!="bidPbancNo"}
                  },ensure_ascii=False),flush=True)
                  if any(item.get(k) in (None,"") for k in needed):
                      continue
                  result,errors=_n05_bidder_details(opener,live._json_post,
                      item["bidPbancNo"],item["bidPbancOrd"],item)
                  print("N05_OFFICIAL_DETAIL_PROBE",json.dumps({
                      "bid_no":item.get("bidPbancNo"),
                      "row_count":len(result["bidders"]) if result else 0,
                      "detail_pages":result.get("pages_checked") if result else 0,
                      "errors":errors[:3]
                  },ensure_ascii=False),flush=True)
                  break
          except Exception as exc:
              print("N05_OFFICIAL_PROBE_ERROR",type(exc).__name__+":"+str(exc)[:140],flush=True)
          PY

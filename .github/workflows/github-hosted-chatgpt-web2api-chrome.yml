name: GitHub-hosted Chrome Web2API secured login gateway smoke (NO user credentials)
on:
  push:
    branches: [experiment/github-hosted-chatgpt-web2api-chrome-20261112]
    paths:
      - '.github/workflows/github-hosted-chatgpt-web2api-chrome.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-secure-remote-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify script syntax and no unencrypted profile uploads
        run: |
          bash -n .github/scripts/w2a_hosted_login.sh
          grep -Fq 'PASS_ONLY_ENCRYPTED_PROFILE_READY_FOR_UPLOAD' .github/scripts/w2a_hosted_login.sh
          grep -Fq 'auth_basic_user_file' .github/scripts/w2a_hosted_login.sh
          echo PASS_SECURE_LOGIN_SCRIPT_PRESENT
      - name: Install GitHub-hosted VNC and password gate dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth x11vnc novnc websockify nginx apache2-utils gnupg
          test -f /usr/share/novnc/vnc.html
      - name: Generate disposable test passwords only in the GitHub-hosted runner
        run: |
          echo "W2A_LOGIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "W2A_PROFILE_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Launch Chrome, Web2API, secured remote desktop tunnel and GPG encryption smoke
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/w2a_hosted_login.sh smoke

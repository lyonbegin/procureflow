name: REAL signed ChatGPT 1.2026.300 send reply attachment + relay on Android 15
on:
  push:
    branches: [fix/chatgpt-relay-verified-routing-20261110]
    paths:
      - .github/workflows/verify-real-chatgpt-signed-2630015-e2e.yml
      - .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
      - .github/scripts/relay-live-android-api.py
      - chatgpt-android-relay/android/**
      - chatgpt-android-relay/web/**
  workflow_dispatch:
permissions: {contents: read}
jobs:
  signed-official-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Verify test script and install API dependencies
        run: |
          bash -n .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
          python3 -m pip install -r chatgpt-android-relay/web/requirements.txt
      - name: Build actual Android AccessibilityService controller
        run: |
          gradle --no-daemon -p chatgpt-android-relay/android :app:assembleDebug
          sha256sum chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Restore verified 1.2026.300 ARM64 application from CI cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chatgpt-2630015-x86.xapk
          key: trusted-chatgpt-xapk-2630015-b24f4bfbb3cf293f
          fail-on-cache-miss: true
      - name: Extract and reverify official package signature and version
        run: |
          set -euo pipefail
          mkdir -p real-chatgpt-evidence /tmp/pinned-official
          unzip -j -oq /tmp/chatgpt-2630015-x86.xapk \
            com.openai.chatgpt.apk config.arm64_v8a.apk config.en.apk config.mdpi.apk \
            -d /tmp/pinned-official
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          "$AAPT" dump badging /tmp/pinned-official/com.openai.chatgpt.apk | head -3 \
            | tee real-chatgpt-evidence/signature-verified-version.txt
          grep -Eq "package: name='com.openai.chatgpt'.*versionCode='2630015'.*versionName='1.2026.300'" \
            real-chatgpt-evidence/signature-verified-version.txt
          "$SIGNER" verify --print-certs /tmp/pinned-official/com.openai.chatgpt.apk \
            | tee real-chatgpt-evidence/signature-verified-certificate.txt
          grep -iq 'b24f4bfbb3cf293f938703b9d87027c1102cc36dc4fa206910e08927db40473c' \
            real-chatgpt-evidence/signature-verified-certificate.txt
          echo 'PASS_SIGNED_OFFICIAL_CHATGPT_2630015'
      - name: Grant KVM for Android emulator
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - name: ACTUAL signed ChatGPT Android UI text send reply and file attach tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 650
          script: OFFICIAL_CHATGPT_SPLIT_KIND=apkpure-arm64 bash .github/scripts/verify-relay-real-chatgpt-original-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-official-chatgpt-signed-2630015-ui-e2e
          path: real-chatgpt-evidence/
          if-no-files-found: warn

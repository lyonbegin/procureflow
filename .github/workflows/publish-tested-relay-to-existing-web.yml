name: Publish tokenless Android Relay APK to existing Railway web
on:
  push:
    branches: [fix/relay-official-file-login-gate-20261111]
    paths:
      - .github/workflows/publish-tested-relay-to-existing-web.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish-existing-site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Verify Android UI no longer exposes manual device token or URL fields
        run: |
          set -euo pipefail
          UI=chatgpt-android-relay/android/app/src/main/java/com/hitel/chatrelay/MainActivity.kt
          ! grep -Fq 'EditText(' "$UI"
          ! grep -Fq '설정 저장 및 다시 연결' "$UI"
          grep -Fq 'ChatGPT 릴레이 · 자동 연결' "$UI"
          grep -Fq 'connectFromPrefs()' "$UI"
          grep -Fq 'CHATGPT_LOGIN_REQUIRED_FOR_FILE_ATTACH' chatgpt-android-relay/android/app/src/main/java/com/hitel/chatrelay/ChatRelayService.kt
          bash -n .github/scripts/verify-android-no-manual-device-token.sh
      - name: Build Android relay app from corrected source
        run: |
          set -euo pipefail
          gradle --no-daemon -p chatgpt-android-relay/android :app:assembleDebug
          mkdir -p /tmp/relay-release
          cp chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk /tmp/relay-release/ChatGPT-Relay-Control.apk
          test "$(stat -c %s /tmp/relay-release/ChatGPT-Relay-Control.apk)" -gt 3000000
          sha256sum /tmp/relay-release/ChatGPT-Relay-Control.apk
      - name: Enable emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Verify on actual Android 15 x86_64 that no token input is shown and Accessibility binds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/verify-android-no-manual-device-token.sh
      - name: Publish ONLY APK and link information on previous Railway branch
        run: |
          set -euo pipefail
          APK=/tmp/relay-release/ChatGPT-Relay-Control.apk
          test -s "$APK"
          git fetch origin feature/chatgpt-android-relay-20261110
          git checkout -B publish-existing-railway origin/feature/chatgpt-android-relay-20261110
          ROOT=chatgpt-android-relay/web/static
          cp "$APK" "$ROOT/ChatGPT-Relay-Control.apk"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatgpt-android-relay/web/static/index.html')
          s=p.read_text(encoding='utf-8')
          old='파일 첨부는 공식 ChatGPT 앱 로그인 후 이용해 주십시오.'
          new='Android 앱에는 디바이스 토큰 입력이 없으며 접근성 활성화 후 자동 연결됩니다. 파일 첨부는 공식 ChatGPT 앱 로그인 후 이용해 주십시오.'
          assert old in s, 'Existing download panel changed; abort rather than overwrite UI'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          sha256sum "$ROOT/ChatGPT-Relay-Control.apk"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/ChatGPT-Relay-Control.apk" "$ROOT/index.html"
          git commit -m 'fix(android): deploy automatic connection APK without token input'
          git push origin HEAD:feature/chatgpt-android-relay-20261110
          echo "EXISTING_RAILWAY_SITE_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatGPT-Relay-Control-AutoConnect-APK
          path: |
            /tmp/relay-release/ChatGPT-Relay-Control.apk
            android-tokenless-evidence/
          retention-days: 30
          if-no-files-found: warn

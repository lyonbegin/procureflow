name: Verify GitHub ChatGPT Web2API relay bridge in isolation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/chatgpt-web2api-bridge-tests.yml
      - .github/scripts/w2a_relay_worker.py
      - .github/scripts/test_w2a_relay_worker.py

permissions:
  contents: read

jobs:
  bridge-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main worker and tests
        uses: actions/checkout@v4
      - name: Checkout isolated relay implementation branch separately
        uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-web2api-relay-bridge-20261113
          path: bridge-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free worker and existing relay dependencies
        run: |
          set -euo pipefail
          python -m pip install -q -r bridge-source/chatgpt-android-relay/web/requirements.txt
          python -m pip install -q websockets==13.1
      - name: Signed GitHub OIDC negative and positive tests
        run: |
          set -euo pipefail
          cd bridge-source/chatgpt-android-relay/web
          python -m unittest discover -s tests -p 'test_gh_oidc.py' -v
      - name: Scoped room persistence, parallel Android and Web2API routing tests
        run: |
          set -euo pipefail
          cd bridge-source/chatgpt-android-relay/web
          python -m unittest discover -s tests -p 'test_web2api_room_persistence.py' -v
          python -m unittest discover -s tests -p 'test_web2api_bridge.py' -v
          python -m unittest discover -s tests -p 'test_web2api_coexistence.py' -v
          python -m py_compile app.py api_v1.py gh_oidc.py
          echo PASS_WEB2API_SCOPED_RELAY_CONTRACTS_AND_BROWSER_ANDROID_COEXISTENCE
      - name: Verify worker protocol without accessing ChatGPT
        run: |
          set -euo pipefail
          python .github/scripts/test_w2a_relay_worker.py
          python -m py_compile .github/scripts/w2a_relay_worker.py
          echo PASS_WEB2API_WORKER_PROTOCOL_GUARDS
      - name: Validate preserved management UI and socket reconnect script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          file=Path("bridge-source/chatgpt-android-relay/web/static/index.html")
          source=file.read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>([\\s\\S]*?)</script>",source)
          assert len(scripts)==1,"original inline UI script count changed"
          assert "function openEventSocket()" in scripts[0]
          assert "function updateWorkerStatus()" in scripts[0]
          assert "web2api.status" in scripts[0]
          assert "planSocketReconnect" in scripts[0]
          Path("/tmp/relay-bridge-ui.js").write_text(scripts[0],encoding="utf-8")
          print("PASS_ORIGINAL_RELAY_UI_STRUCTURE_PRESERVED")
          PY
          node --check /tmp/relay-bridge-ui.js
          echo PASS_WEB2API_WORKER_UI_SYNTAX
      - name: Verify original server API regression
        run: |
          set -euo pipefail
          cd bridge-source/chatgpt-android-relay/web
          python tests/test_api_v1.py
          echo PASS_RELAY_ORIGINAL_API_REGRESSIONS

name: Verify real ChatGPT multi-account registration and encrypted cache

on:
  push:
    branches:
      - feature/hitel-multi-login-manager-20261117
    paths:
      - ".github/scripts/w2a_multi_login_gateway.py"
      - ".github/scripts/test_w2a_multi_login_gateway.py"
      - ".github/workflows/hitel-two-account-manual-login.yml"
      - ".github/workflows/hitel-multi-account-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -q cryptography==44.0.2 playwright==1.56.0 pyyaml
      - name: Run real-account-gate and encrypted profile tests
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/w2a_multi_login_gateway.py
          python3 -m unittest discover -s .github/scripts -p test_w2a_multi_login_gateway.py -v
      - name: Verify actual GitHub Actions noVNC workflow and mobile JS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml
          workflow=yaml.safe_load(Path('.github/workflows/hitel-two-account-manual-login.yml').read_text())
          assert workflow["permissions"]["statuses"]=="write"
          source=Path('.github/scripts/w2a_multi_login_gateway.py').read_text()
          assert "CHATGPT_LOGIN_NOT_VERIFIED" in source
          assert "ACCOUNT_ALREADY_REGISTERED" in source
          assert "registration-complete.flag" in source
          assert "load_registry()" in source
          assert "store_registry()" in source
          for name in ('LOGIN_HTML','DASH_HTML'):
              html=re.search(name+r' = """(.*?)"""',source,re.S).group(1)
              js=re.search(r'<script>(.*?)</script>',html,re.S).group(1)
              Path('/tmp/'+name+'.js').write_text(js)
          print("PASS_MULTI_ACCOUNT_CHROME_UI_AND_ARTIFACT_WORKFLOW")
          PY
          node --check /tmp/LOGIN_HTML.js
          node --check /tmp/DASH_HTML.js

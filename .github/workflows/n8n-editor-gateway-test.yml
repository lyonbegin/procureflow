name: Native n8n Editor Access Gateway
on:
  pull_request:
    paths:
      - "n8n/editor-proxy/**"
      - ".github/workflows/n8n-editor-gateway-test.yml"
  push:
    branches: [main]
    paths:
      - "n8n/editor-proxy/**"
      - ".github/workflows/n8n-editor-gateway-test.yml"
permissions:
  contents: read
jobs:
  caddy-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build native n8n proxy
        run: docker build -f n8n/editor-proxy/Dockerfile -t procureflow-n8n-editor-gateway:ci .
      - name: Validate reverse proxy config and no browser Basic Auth
        run: |
          set -euo pipefail
          docker run --rm --entrypoint caddy procureflow-n8n-editor-gateway:ci adapt --config /etc/caddy/Caddyfile --validate --pretty > /tmp/proxy-adapted.json
          grep -q 'n8n.railway.internal:5678' /tmp/proxy-adapted.json
          if grep -q '"authentication"' /tmp/proxy-adapted.json; then
            echo 'Unexpected browser Basic Auth'; exit 1
          fi
      - name: Public owner setup denied but browser Basic Auth absent
        run: |
          set -euo pipefail
          docker run -d --rm --name caddy-n8n-native -p 8080:8080 procureflow-n8n-editor-gateway:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/setup)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/rest/owner/setup)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" != "401"
          echo "EDITOR_WITHOUT_BASIC_AUTH_TEST_PASSED"

name: HITEL per-task independent Chrome (one GitHub runner per task)
run-name: HITEL isolated Chrome ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Existing Railway task ID; independent VM, browser and profile"
        required: true
        type: choice
        options: [stock-a, stock-tv, scribd-18109]

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: hitel-independent-chrome-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  browser:
    name: Independent GitHub VM Chrome profile and task socket
    runs-on: ubuntu-24.04
    timeout-minutes: 290
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      DISPLAY: :99
      HITEL_TASK_ID: ${{ inputs.task_id }}
      RELAY_WS_URL: wss://hitel-integration-api-production.up.railway.app/ws/task/${{ inputs.task_id }}
      PYTHONPATH: .github/scripts
      PYTHONUNBUFFERED: "1"
      W2A_WORKER_SECONDS: "14400"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: false

      - name: Restore pre-registered encrypted account 1
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography==44.0.2 playwright==1.56.0 websockets==13.1
          # GitHub ubuntu-24.04 image already provides Xvfb. Reinstalling
          # unrelated Mesa/GBM packages made the previously signed Chrome
          # worker fail whenever the Ubuntu mirror briefly timed out.
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          fi
          command -v Xvfb
          ROOT="$RUNNER_TEMP/w2a-check"
          mkdir -p "$ROOT/download"
          RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-chatgpt-encrypted-multi-profiles&per_page=50" \
            --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|reverse|.[0].workflow_run.id // empty')"
          test -n "$RUN_ID"
          # GitHub's artifact ZIP gateway occasionally returns HTTP 503.
          # Retry ONLY this read-only artifact download; never re-send a
          # ChatGPT question or alter an account/profile.
          for attempt in $(seq 1 8); do
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT/download" >/dev/null 2>&1; then
              echo PASS_ENCRYPTED_PROFILE_ARTIFACT_DOWNLOADED
              break
            fi
            if [[ "$attempt" == "8" ]]; then
              echo FAIL_GITHUB_PROFILE_ARTIFACT_DOWNLOAD_503_OR_UNAVAILABLE
              exit 1
            fi
            echo RETRY_ONLY_ARTIFACT_READ_ATTEMPT=$attempt
            sleep 10
          done
          test -s "$ROOT/download/registry.bin"
          test -s "$ROOT/download/account-0001.bin"
          python3 .github/scripts/w2a_profile_crypto.py restore \
            "$ROOT/download/account-0001.bin" "$ROOT"
          test -d "$ROOT/chrome-profile"
          echo PASS_EXISTING_REGISTERED_CHROME_ACCOUNT_RESTORED

      - name: Start real logged-in Chrome, assert session and registry email match
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$ROOT/chrome-profile" \
            https://chatgpt.com/ >"$ROOT/chrome.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo PASS_LIVE_CHROME_CDP_READY
              break
            fi
            if [ "$i" -eq 45 ]; then echo FAIL_CHROME_CDP_START; exit 1; fi
            sleep 2
          done
          python3 .github/scripts/w2a_verify_saved_registry.py
          echo PASS_ACCOUNT_1_LIVE_IDENTITY_REGISTRY_MATCH

      - name: Run original Web2API local adapter with pinned DOM patch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          git clone -q https://github.com/MartinezS8/chatgpt-web2api.git "$ROOT/original"
          git -C "$ROOT/original" checkout -q 497527dceabfa3f95961e23c291e618c5570f1ac
          python3 .github/scripts/w2a_patch_vendor_dom.py "$ROOT/original"
          python3 .github/scripts/w2a_patch_vendor_composer_20261120.py "$ROOT/original"
          # STOCK-TV ONLY: a complete schema-matching response ends this request.
          # Never modify the pinned Web2API source in Git; other task IDs skip
          # this local-runner patch and retain their existing detector unchanged.
          if [[ "$HITEL_TASK_ID" == "stock-tv" ]]; then
            cat > "$ROOT/original/src/chatgpt_web2api/hitel_stocktv_json_receipt.py" <<'STOCKTV_JSON_VALIDATOR'
          """Validate the ONE received stock-tv JSON, without using browser UI-completion signals.
          
          Only the expected source IDs/order and the actual JSON content determine whether
          the response is ready. Other HITEL workloads keep their existing detector.
          No network request, ChatGPT send, or DOM control is performed here.
          """
          from __future__ import annotations
          
          import json
          import re
          
          SCHEMA = "TV-TRADE-EVIDENCE-10-v2"
          CASE_TYPES = {"EXECUTED_TRADE", "MARKET_TRANSACTION_EVENT", "HISTORICAL_DATA_BACKTEST"}
          ACCESS = {"FULL_TEXT", "ABSTRACT_ONLY", "PUBLIC_SUMMARY"}
          STATUSES = {"SEARCHED", "PARTIAL", "NO_WEB_ACCESS"}
          CASE_FIELDS = (
              "title", "publisher", "document_url", "instrument", "trade_period",
              "transaction_evidence", "entry_exit", "reported_numbers",
              "economic_mechanism", "evidence_location", "relationship_to_source", "limitations",
          )
          
          
          def _expected_from_sent_prompt(sent_prompt):
              """Get immutable batch identity from the actual request payload, not the UI."""
              if not isinstance(sent_prompt, str) or "원본:" not in sent_prompt or SCHEMA not in sent_prompt:
                  return None
              try:
                  payload = sent_prompt.split("원본:", 1)[1].lstrip()
                  originals, _ = json.JSONDecoder().raw_decode(payload)
              except (ValueError, TypeError):
                  return None
              match = re.search(r'"schema":"TV-TRADE-EVIDENCE-10-v2","batch_number":(\d+),"research_only":true', sent_prompt)
              if not match or not isinstance(originals, list) or not 1 <= len(originals) <= 10:
                  return None
              expected = []
              for item in originals:
                  if not isinstance(item, dict) or not all(key in item for key in ("source_order", "script_id", "title")):
                      return None
                  if not isinstance(item["source_order"], int) or not isinstance(item["script_id"], str):
                      return None
                  if not isinstance(item["title"], str):
                      return None
                  expected.append((item["source_order"], item["script_id"], item["title"]))
              batch = int(match.group(1))
              if not 1 <= batch <= 443:
                  return None
              first = (batch - 1) * 10 + 1
              if expected != [(first + i, pair[1], pair[2]) for i, pair in enumerate(expected)]:
                  return None
              if batch != 443 and len(expected) != 10:
                  return None
              if batch == 443 and len(expected) != 8:
                  return None
              return batch, expected
          
          
          def _parse_received_json(answer):
              if not isinstance(answer, str) or not answer.strip():
                  return None
              data = answer.strip()
              if data.startswith("```"):
                  lines = data.splitlines()
                  if len(lines) < 3 or not lines[-1].strip() == "```":
                      return None
                  if lines[0].strip().lower() not in ("```", "```json"):
                      return None
                  data = "\n".join(lines[1:-1]).strip()
              try:
                  return json.loads(data)
              except (ValueError, TypeError):
                  return None
          
          
          def matches_stocktv_research_json(received_answer, sent_prompt):
              """True iff the complete JSON structurally matches this single ten-source task.
          
              JSON may be observed while ChatGPT is still rendering. Its COMPLETE parse,
              exact source identities and case fields are the acceptance conditions.
              We do not require a stop button, copy/action row, UI text stability,
              thinking-indicator absence or a visible copy of the user's question.
              """
              scope = _expected_from_sent_prompt(sent_prompt)
              reply = _parse_received_json(received_answer)
              if scope is None or not isinstance(reply, dict):
                  return False
              batch, expected = scope
              if reply.get("schema") != SCHEMA or reply.get("batch_number") != batch or reply.get("research_only") is not True:
                  return False
              records = reply.get("source_results")
              if not isinstance(records, list) or len(records) != len(expected):
                  return False
              for (order, script_id, title), record in zip(expected, records):
                  if not isinstance(record, dict):
                      return False
                  if (record.get("source_order"), record.get("script_id"), record.get("title")) != (order, script_id, title):
                      return False
                  if record.get("research_status") not in STATUSES:
                      return False
                  if not isinstance(record.get("search_queries"), list) or not isinstance(record.get("exclusions"), list):
                      return False
                  cases = record.get("cases")
                  if not isinstance(cases, list) or (record["research_status"] == "NO_WEB_ACCESS" and cases):
                      return False
                  for case in cases:
                      if not isinstance(case, dict) or case.get("case_type") not in CASE_TYPES or case.get("access_level") not in ACCESS:
                          return False
                      if any(not isinstance(case.get(field), str) or not case[field].strip() for field in CASE_FIELDS):
                          return False
                      if not case["document_url"].startswith("https://"):
                          return False
              return True
          STOCKTV_JSON_VALIDATOR
            python3 - <<'STOCKTV_ONLY_LOCAL_INSTALL'
          from pathlib import Path
          import importlib.util
          import json
          import os
          
          root=Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api"
          detector=root/"completion_detector.py"
          source=detector.read_text(encoding="utf-8")
          marker="            # ── Completion detection ─────────────────────────────────────\n"
          if source.count(marker)!=1 or "STOCKTV_VALIDATED_JSON_RECEIVED" in source:
              raise SystemExit("REFUSE_STOCKTV_DETECTOR_UNEXPECTED_VENDOR_SOURCE")
          fastpath=(
              "            # For THIS stock-tv action only: the received valid JSON is final.\n"
              "            from .hitel_stocktv_json_receipt import matches_stocktv_research_json\n"
              "            if matches_stocktv_research_json(\n"
              "                current, getattr(turn_anchor, 'sent_text', None)\n"
              "            ):\n"
              "                self.dom_completion_verified = True\n"
              "                print('HITEL_W2A_STAGE=TURN_COMPLETED', flush=True)\n"
              "                break\n"
          )
          source=source.replace(marker,fastpath+marker)
          compile(source,str(detector),"exec")
          detector.write_text(source,encoding="utf-8")
          helper=root/"hitel_stocktv_json_receipt.py"
          spec=importlib.util.spec_from_file_location("test_stocktv_receipt",helper)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          
          def case(batch,n):
              first=(batch-1)*10+1
              originals=[{"source_order":first+i,"script_id":f"ID{i}","title":f"Title{i}"}
                         for i in range(n)]
              prompt="원본:"+json.dumps(originals,ensure_ascii=False,separators=(",",":"))+(
                  f'\n필수 단일 JSON:{{"schema":"TV-TRADE-EVIDENCE-10-v2","batch_number":{batch},"research_only":true}}')
              response={
                "schema":"TV-TRADE-EVIDENCE-10-v2","batch_number":batch,"research_only":True,
                "source_results":[{"source_order":r["source_order"],"script_id":r["script_id"],
                   "title":r["title"],"research_status":"SEARCHED","search_queries":["source"],
                   "cases":[],"exclusions":[],"limitations":"No verified trading evidence"} for r in originals]}
              raw=json.dumps(response,ensure_ascii=False)
              assert mod.matches_stocktv_research_json(raw,prompt)
              assert not mod.matches_stocktv_research_json(raw[:-1],prompt)
              response["source_results"][0]["script_id"]="WRONG_ID"
              assert not mod.matches_stocktv_research_json(json.dumps(response),prompt)
          
          case(1,10)
          case(443,8)
          print("PASS_STOCKTV_ACTION_RECEIVED_JSON_ONLY_NO_DOM_UI_GATES",flush=True)
          STOCKTV_ONLY_LOCAL_INSTALL
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/api_server.py").read_text()
          assert 'new_conversation = body.get("new_conversation") is True' in source, "NEW_ROOM_FORCE_NEW_CHAT_PATCH_MISSING"
          assert '"code": type(exc).__name__' in source, "VENDOR_SAFE_ERROR_CLASS_PATCH_MISSING"
          assert 'await self._driver.ensure_current_conversation(conversation_id)' in source, "VENDOR_NO_RELOAD_PATCH_MISSING"
          assert 'self._driver._current_conv_id = conversation_id' in source, "VENDOR_ROOM_BINDING_PATCH_MISSING"
          print("PASS_PINNED_VENDOR_CURRENT_PATCH_VERIFIED")
          detector=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/completion_detector.py").read_text()
          assert "DOM_VERIFIED_NEW_ASSISTANT_COMPLETED" in detector, "WEB2API_DOM_PROOF_PATCH_MISSING"
          assert "backend_observation_key" in detector, "WEB2API_PROJECTION_POLL_PATCH_MISSING"
          assert "backend_retry_at" in detector, "WEB2API_READ_ONLY_RETRY_MISSING"
          assert "verified_user.get('match') is True" in detector, "WEB2API_NEW_USER_CORRELATION_MISSING"
          assert "HITEL_W2A_STAGE=ASSISTANT_SEEN" in detector, "WEB2API_BROWSER_STAGE_MISSING"
          assert "time.monotonic() - last_backend_check > 3.0" not in detector, "WEB2API_PROJECTION_READ_STORM_NOT_REMOVED"
          assert "and not has_action" in detector, "WEB2API_DOM_ACTION_READ_SUPPRESSION_MISSING"
          driver=(Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/cdp_driver.py").read_text()
          assert "self._completion.dom_completion_verified" in driver, "WEB2API_REDUNDANT_RECONCILIATION_NOT_REMOVED"
          assert "HITEL_W2A_STAGE=SEND_DISPATCHED" in driver, "WEB2API_SEND_STAGE_MISSING"
          assert "full_text = await _send_and_collect()  # no automatic resend" in source, "WEB2API_SEND_REPLAY_NOT_DISABLED"
          print("PASS_INSTALLED_WEB2API_DOM_PROJECTION_READ_FIX_NO_CHAT_SEND_RETRY")
          PY
          # This is an actual, source-pinned Web2API config path. The old
          # built-in request=120s and detector=90/120s prematurely failed
          # valid long reasoning generations. Wait for verified end_turn or
          # an explicit upstream failure; never fail simply after 150s.
          # The GitHub Actions job lifetime remains the outer guard.
          mkdir -p "$HOME/.chatgpt_web2api"
          cat > "$HOME/.chatgpt_web2api/config.json" <<'W2A_WAIT_JSON'
          {
            "request_timeout": 14400,
            "tab_mode": "owned",
            "parallel_tabs": true,
            "detector_reasoning_first_content_timeout_seconds": 14400,
            "detector_reasoning_stream_idle_timeout_seconds": 14400,
            "detector_default_first_content_timeout_seconds": 14400,
            "detector_default_stream_idle_timeout_seconds": 14400,
            "detector_hard_timeout_seconds": 14400
          }
          W2A_WAIT_JSON
          # Assert the exact runnable source contains the confirmed live
          # ChatGPT role=textbox composer selector after both pinned patches.
          python3 - <<'W2A_SELECTOR_CHECK'
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"])/"w2a-check/original/src/chatgpt_web2api/chatgpt_dom.py"
          source=p.read_text("utf-8")
          if source.count('[role="textbox"][contenteditable="true"]')!=1:
              raise SystemExit("FAIL_RUNTIME_EDITOR_SELECTOR_NOT_INSTALLED")
          print("PASS_CURRENT_LIVE_EDITOR_SELECTOR_PRESENT_IN_INSTALLED_VENDOR_SOURCE")
          W2A_SELECTOR_CHECK
          python3 -m pip install -q "$ROOT/original"
          python3 - <<'W2A_WAIT_CHECK'
          from chatgpt_web2api.config import Config
          cfg = Config.load()
          assert cfg.server.request_timeout >= 600, "UPSTREAM_HTTP_WAIT_BELOW_10_MIN"
          assert cfg.chatgpt.detector_default_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_first_content_timeout_seconds >= 600
          assert cfg.chatgpt.detector_default_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_reasoning_stream_idle_timeout_seconds >= 600
          assert cfg.chatgpt.detector_hard_timeout_seconds >= 600
          assert cfg.chatgpt.tab_mode == 'owned'
          assert cfg.chatgpt.parallel_tabs is True
          print("PASS_CHATGPT_ORIGINAL_WEB2API_LONG_RUNNING_WAIT_CONFIG")
          W2A_WAIT_CHECK
          # Per-room vendor instances are started by the authenticated worker,
          # not by the workflow. No shared singleton browser tab in normal mode.
          if [[ "${{ inputs.operation }}" == "verify_or_pair" ]]; then
            chatgpt-web2api --port 18080 --host 127.0.0.1 --cdp-port 9222 \
              >"$ROOT/web2api.log" 2>&1 &
            for i in $(seq 1 50); do
              if curl -fsS --max-time 5 http://127.0.0.1:18080/health >/dev/null 2>&1; then
                echo PASS_PAIRING_ONLY_LOCAL_WEB2API_HEALTH
                break
              fi
              if [ "$i" -eq 50 ]; then echo FAIL_PAIRING_LOCAL_WEB2API_START; exit 1; fi
              sleep 2
            done
          else
            echo PASS_LAZY_PER_ROOM_OWNED_TAB_WORKER_CONFIGURATION
          fi

      - name: Connect signed task worker; verify Railway task owner (not legacy /ws)
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/hitel_web2api_worker.py .github/scripts/hitel_room_tab_pool.py
          date +%s >"$RUNNER_TEMP/bridge-worker.started-at"
          python3 .github/scripts/hitel_web2api_worker.py >"$RUNNER_TEMP/bridge-worker.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/bridge-worker.pid"
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/bridge-worker.pid")" 2>/dev/null; then
              grep -E 'RELAY_|FAIL_|Traceback|RuntimeError' "$RUNNER_TEMP/bridge-worker.log" | tail -n 30 || true
              echo FAIL_ISOLATED_SIGNED_WORKER_BOOTSTRAP
              exit 1
            fi
            if grep -q 'PASS_AUTHENTICATED_ROOM_TAB_PREWARM=0/0' "$RUNNER_TEMP/bridge-worker.log"; then
              STATE="$(curl --max-time 8 -fsS "https://hitel-integration-api-production.up.railway.app/integrations/v1/public/isolated/tasks/$HITEL_TASK_ID/status" |
                python3 -c 'import json,sys,os; s=json.load(sys.stdin); print(int(s.get("worker_bootstrap_ready") is True and s.get("task_id")==os.environ["HITEL_TASK_ID"]))' 2>/dev/null || echo 0)"
              if [[ "$STATE" == "1" ]]; then
                echo "PASS_ISOLATED_CHROME_TASK_CONNECTED=$HITEL_TASK_ID"
                break
              fi
            fi
            if ((i == 180)); then
              tail -n 40 "$RUNNER_TEMP/bridge-worker.log" | grep -E 'RELAY_|FAIL_|PASS_' || true
              echo FAIL_TASK_CHROME_NOT_AUTHENTICATED
              exit 1
            fi
            sleep 2
          done

      - name: Keep only this task Chrome alive
        run: |
          set -euo pipefail
          PID="$(cat "$RUNNER_TEMP/bridge-worker.pid")"
          START="$(cat "$RUNNER_TEMP/bridge-worker.started-at")"
          MISSED=0
          RESTARTS=0
          while (( $(date +%s) - START < 14360 )); do
            HEALTH="$(curl --max-time 8 -fsS "https://hitel-integration-api-production.up.railway.app/integrations/v1/public/isolated/tasks/$HITEL_TASK_ID/status" |
              python3 -c 'import json,sys,os; s=json.load(sys.stdin); print(int(s.get("worker_connected") is True and s.get("task_id")==os.environ["HITEL_TASK_ID"]))' 2>/dev/null || echo 0)"
            if [[ "$HEALTH" == "1" ]] && kill -0 "$PID" 2>/dev/null; then MISSED=0; else MISSED=$((MISSED+1)); fi
            if ((MISSED >= 3)); then
              STATE="$(curl --max-time 8 -fsS "https://hitel-integration-api-production.up.railway.app/integrations/v1/public/isolated/tasks/$HITEL_TASK_ID/status" || echo '')"
              COUNT="$(printf '%s' "$STATE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["worker_active_jobs_count"])' 2>/dev/null || echo UNKNOWN)"
              if [[ "$COUNT" != "0" ]]; then
                echo "PRESERVE_ACTIVE_OR_UNCERTAIN_TASK_AI_REQUEST=$COUNT"
                sleep 15
                continue
              fi
              if ((RESTARTS >= 4)); then echo FAIL_ISOLATED_CHROME_RECOVERY_EXHAUSTED; exit 1; fi
              echo "REBOOT_ONLY_THIS_TASK_CHROME=$HITEL_TASK_ID"
              kill "$PID" 2>/dev/null || true
              sleep 3
              python3 .github/scripts/hitel_web2api_worker.py >>"$RUNNER_TEMP/bridge-worker.log" 2>&1 &
              PID="$!"
              echo "$PID" >"$RUNNER_TEMP/bridge-worker.pid"
              RESTARTS=$((RESTARTS+1))
              MISSED=0
              sleep 25
            else sleep 15; fi
          done

      - name: Scrubbed task-specific evidence
        if: always()
        run: |
          echo "Independent task: $HITEL_TASK_ID" >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/bridge-worker.log"; then
            grep -E 'PASS_GITHUB_OIDC_RELAY_WEBSOCKET_CONNECTED|PASS_RELAY_WEB2API_JOB_RESULT_VERIFIED|RELAY_CONNECTION_INTERRUPTED|FAIL_' \
                "$RUNNER_TEMP/bridge-worker.log" | tail -n 25 >> "$GITHUB_STEP_SUMMARY" || true
          fi

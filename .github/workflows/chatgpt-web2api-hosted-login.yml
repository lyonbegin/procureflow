name: ChatGPT Web2API - direct Google login smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/chatgpt-web2api-hosted-login.yml
      - .github/scripts/w2a_google_login_probe.py

permissions:
  contents: read

concurrency:
  group: chatgpt-web2api-google-login-probe
  cancel-in-progress: false

jobs:
  login-probe:
    name: Existing Google secrets -> GitHub Chrome -> ChatGPT
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FREEMOA_GOOGLE_EMAIL: ${{ secrets.FREEMOA_GOOGLE_EMAIL }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install existing Chrome browser control dependency
        run: |
          python -m pip install -q playwright==1.56.0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          python -m py_compile .github/scripts/w2a_google_login_probe.py
      - name: Start local-only Chrome and attempt Google sign-in
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$RUNNER_TEMP/w2a-xvfb.log" 2>&1 &
          sleep 3
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo FAIL_XVFB_START
            tail -n 20 "$RUNNER_TEMP/w2a-xvfb.log" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/w2a-profile"
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/w2a-profile" \
            https://chatgpt.com >"$RUNNER_TEMP/w2a-chrome.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null; then
              echo PASS_GITHUB_CHROME_CDP_LOCAL
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo FAIL_GITHUB_CHROME_CDP_STARTUP
              tail -n 35 "$RUNNER_TEMP/w2a-chrome.log" || true
              tail -n 15 "$RUNNER_TEMP/w2a-xvfb.log" || true
              exit 1
            fi
            sleep 2
          done
          python .github/scripts/w2a_google_login_probe.py
      - name: Summary
        if: always()
        run: |
          echo "This one-off test uses no W2A_LOGIN_PASSWORD, no W2A_PROFILE_KEY, and opens no public browser tunnel."
          echo "Chrome session remains on the ephemeral GitHub runner only; nothing is uploaded."

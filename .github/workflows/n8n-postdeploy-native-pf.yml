name: Native n8n PF15 Against Live Evidence (Read Only)
on:
  pull_request:
    paths:
      - ".github/workflows/n8n-postdeploy-native-pf.yml"
      - "n8n/operational/**"
      - "n8n/Dockerfile"
      - "n8n/custom-nodes/**"
      - "n8n/operational_manifest.json"
      - "n8n_job_bridge.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-fifteen-native-pf:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - name: Ensure latest new read-only live G2B plan endpoint exists
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://procureflow-api-production.up.railway.app/api/n8n/operational/flows/PF05/next-action \
            -o /tmp/pf05.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pf05.json'))
          assert d['flow_id']=='PF05'
          assert d['read_only'] is True and d['job_enqueued'] is False
          assert d['bid_submitted'] is False
          print('LIVE_PF05_PLAN_READ_ONLY_VERIFIED',d['status'])
          PY
      # The pinned upstream n8n build installs @vscode/ripgrep. Its postinstall
      # calls GitHub releases and anonymous runners can get HTTP 403, making
      # a correct n8n source build fail before any PF workflow is executed.
      # Reuse the already-proven BuildKit CI-only secret pattern from
      # n8n-single-engine-tests.yml. Do not change the production Dockerfile,
      # pass a token as ARG/ENV, or bake it into the image.
      - name: Prepare disposable CI-only Dockerfile with read-only token mount
        run: |
          python3 - <<'PY'
          from pathlib import Path
          original=Path('n8n/Dockerfile').read_text()
          needle='RUN pnpm install --frozen-lockfile --trust-lockfile ' + chr(92) + '\n'
          assert original.count(needle)==1, 'Pinned production Dockerfile install step changed'
          replacement=(
              'RUN --mount=type=secret,id=github_token ' + chr(92) + '\n'
              + '    export GITHUB_TOKEN="$(cat /run/secrets/github_token)" && ' + chr(92) + '\n'
              + '    pnpm install --frozen-lockfile --trust-lockfile ' + chr(92) + '\n'
          )
          Path('/tmp/ProcureFlow.PF15.Dockerfile.ci').write_text(
              original.replace(needle,replacement))
          print('PF15_CI_ONLY_SECRET_MOUNT_PREPARED')
          PY
      - name: Build actual n8n image with CI-only token (no production credentials)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker build --progress=plain --secret id=github_token,env=GITHUB_TOKEN \
            -f /tmp/ProcureFlow.PF15.Dockerfile.ci \
            -t procureflow-n8n-integration:qa .
      - name: Execute all FIFTEEN native PF workflows through actual n8n 2.44.6
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e N8N_ENCRYPTION_KEY=ci-temporary-isolated-readonly             -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -v "${PWD}/n8n/operational:/pf-workflows:ro" \
            procureflow-n8n-integration:qa \
            -c 'set -eu
              n8n import:workflow --separate --input=/pf-workflows
              for pf in 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15; do
                echo "PF_NATIVE_START PF${pf}"
                n8n execute --id="PFOP2026PF${pf}WF" > "/tmp/PF${pf}.log" 2>&1 ||
                  { tail -120 "/tmp/PF${pf}.log"; exit 1; }
                grep -q "Execution was successful:" "/tmp/PF${pf}.log" ||
                  { tail -120 "/tmp/PF${pf}.log"; exit 1; }
                grep -q "actual_job_executed" "/tmp/PF${pf}.log" ||
                  { tail -120 "/tmp/PF${pf}.log"; exit 1; }
                echo "PF_NATIVE_READ_ONLY_PASS PF${pf}"
              done
              echo N8N_LIVE_ALL_FIFTEEN_READ_ONLY_PASSED'

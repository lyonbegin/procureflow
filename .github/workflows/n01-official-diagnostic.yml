name: N01 official G2B live bid notice POST (one-shot diagnostic)
on:
  push:
    branches:
      - feature/procureflow-unified-studio-20261107
    paths:
      - .github/workflows/n01-official-diagnostic.yml
permissions:
  contents: read
jobs:
  n01-official-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run real N01 production Python function against official G2B
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,'n8n/unified')
          import live_nine_test as live
          session=live._client()
          live._once(session)
          out=live._official_g2b_search(session)
          assert out['notice_list']=='AVAILABLE',out
          assert out['search_request_verified'] is True,out
          assert out['bid_no']==live.CASE,out
          assert out['agency'] and '전남테크노파크' in out['agency'],out
          assert out['latest_notice_count']>0,out
          assert out['latest_notice_rows'][0]['bid_no'] != live.CASE or out['selected_search_count']>0
          assert out['source']==live.G2B_BID_LIST
          print('N01_PYTHON_PRODUCTION_FUNCTION_PASS',json.dumps({
            'selected_bid_no':out['bid_no'],'selected_title':out['title'],
            'agency':out['agency'],'budget':out.get('budget'),
            'recent_notice_count':out['latest_notice_count'],
            'recent_sample':out['latest_notice_rows'][:3],
            'endpoint':out['source']},ensure_ascii=False),flush=True)
          PY
      - name: Check public official G2B WebSquare bid notice endpoint (no API key)
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,http.cookiejar,datetime
          endpoint="https://www.g2b.go.kr/pn/pnp/pnpe/BidPbac/selectBidPbacScrollTypeList.do"
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          try:
              r=opener.open(urllib.request.Request('https://www.g2b.go.kr/',headers={'User-Agent':'Mozilla/5.0'}),timeout=18)
              print('N01_HOME',r.status,len(r.read(1200)),flush=True)
          except Exception as e:print('N01_HOME_ERROR',type(e).__name__,str(e)[:140],flush=True)
          def walk(node,depth=0):
              if depth>7:return []
              out=[]
              if isinstance(node,list):
                  for item in node[:100]:out+=walk(item,depth+1)
              elif isinstance(node,dict):
                  if 'bidPbancNm' in node or 'bidPbancUntyNo' in node or 'bidPbancNo' in node:
                      out.append(node)
                  else:
                      for v in node.values():
                          if isinstance(v,(dict,list)):out+=walk(v,depth+1)
              return out
          def send(case):
              target='R26BK01787028' if case else ''
              x={"untyBidPbancNo":"","bidPbancNo":target,"bidPbancOrd":"","prcmBsneUntyNoOrd":"",
                 "prcmBsneSeCd":"0000 조070001 조070002 조070003 조070004 조070005 민079999",
                 "bidPbancNm":"","pbancPstgDt":"","ldocNoVal":"","bidPrspPrce":"",
                 "ctrtDmndRcptNo":"","dmstcOvrsSeCd":"","pbancKndCd":"공440002",
                 "ctrtTyCd":"","bidCtrtMthdCd":"","scsbdMthdCd":"",
                 "fromBidDt":"20261022" if case else "20261101",
                 "toBidDt":"20261108","bsneAllYn":"Y","frcpYn":"Y","rsrvYn":"Y","laseYn":"Y",
                 "untyGrpGb":"","dmstNm":"","pbancPicNm":"","odnLmtLgdngCd":"",
                 "odnLmtLgdngNm":"","intpCd":"","intpNm":"","dtlsPrnmNo":"",
                 "dtlsPrnmNm":"","slprRcptDdlnYn":"","lcrtTyCd":"","isMas":"",
                 "isElpdt":"","oderInstUntyGrpNo":"","esdacYn":"","infoSysCd":"정010029",
                 "contxtSeCd":"콘010006","bidDateType":"R","brcoOrgnCd":"",
                 "deptOrgnCd":"","isShop":"","srchTy":"0","cangParmVal":"",
                 "currentPage":"1","recordCountPerPage":"20","startIndex":1,"endIndex":20}
              headers={"Content-Type":"application/json;charset=UTF-8","Accept":"application/json",
                  "Menu-Info":'{"menuNo":"01175","menuCangVal":"PNPE001_01","bsneClsfCd":"%EC%97%85130026","scrnNo":"00941"}',
                  "submissionid":"mf_wfm_container_tacBidPbancLst_contents_tab2_body_sbmPbancBidPbancLst",
                  "Target-Id":"btnS0004","Usr-Id":"null",
                  "Origin":"https://www.g2b.go.kr","Referer":"https://www.g2b.go.kr/",
                  "User-Agent":"Mozilla/5.0"}
              req=urllib.request.Request(endpoint,method='POST',data=json.dumps({"dlBidPbancLstM":x},ensure_ascii=False).encode('utf-8'),headers=headers)
              try:
                  with opener.open(req,timeout=22) as r:
                      raw=r.read(2100000);print('N01_POST',case,'status',r.status,'bytes',len(raw),'type',r.headers.get('Content-Type'),flush=True)
                  try:d=json.loads(raw)
                  except Exception:
                      print('N01_RESPONSE_NONJSON',raw[:200].decode('utf8',errors='replace'),flush=True);return
                  print('N01_KEYS',list(d)[:20] if isinstance(d,dict) else type(d).__name__,flush=True)
                  out=walk(d)
                  print('N01_ROWS',len(out),'MATCHES',[{'no':r.get('bidPbancUntyNo') or r.get('bidPbancNo'),'title':str(r.get('bidPbancNm',''))[:110],'date':str(r.get('pbancPstgDt',''))[:20]} for r in out[:6]],flush=True)
                  print('N01_RESULT_SHAPE',str(type(d.get('result')) if isinstance(d,dict) else type(d)),flush=True)
                  if case and out:
                      print('N01_TARGET_FIELDS',json.dumps({k:str(v)[:140] for k,v in out[0].items() if isinstance(v,(str,int,float))},ensure_ascii=False)[:4200],flush=True)
                  if not out and isinstance(d,dict):print('N01_RESULT_SUMMARY',str(d.get('result'))[:420],flush=True)
              except Exception as e:
                  print('N01_POST_ERROR',case,type(e).__name__,str(e)[:250],flush=True)
          send(True)
          send(False)
          PY

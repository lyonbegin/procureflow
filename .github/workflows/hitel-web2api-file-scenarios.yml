name: HITEL - file add/remove/read/export Chrome UI scenarios

on:
  push:
    branches:
      - test/hitel-web2api-scenario-matrix-20261118
    paths:
      - ".github/scripts/w2a_file_scenarios.py"
      - ".github/workflows/hitel-web2api-file-scenarios.yml"
  workflow_dispatch:

concurrency:
  group: hitel-standalone-file-scenarios
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  files:
    name: Test 5 real file scenarios with saved account
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Restore user-registered account 1 without Railway
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography==44.0.2 playwright==1.56.0
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          ROOT="$RUNNER_TEMP/w2a-check"
          mkdir -p "$ROOT/download"
          RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-chatgpt-encrypted-multi-profiles&per_page=50" \
            --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|reverse|.[0].workflow_run.id // empty')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT/download" >/dev/null
          test -s "$ROOT/download/registry.bin"
          test -s "$ROOT/download/account-0001.bin"
          python3 .github/scripts/w2a_profile_crypto.py restore \
            "$ROOT/download/account-0001.bin" "$ROOT"
          test -d "$ROOT/chrome-profile"
          echo PASS_SAVED_USER_FILE_TEST_PROFILE_RESTORED
      - name: Start actual saved account Chrome and verify login identity
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-check"
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$ROOT/chrome-profile" \
            https://chatgpt.com/ >"$ROOT/chrome.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo PASS_SAVED_ACCOUNT_CHROME_READY
              break
            fi
            if [ "$i" -eq 45 ]; then echo FAIL_SAVED_ACCOUNT_CHROME_START; exit 1; fi
            sleep 2
          done
          python3 .github/scripts/w2a_verify_saved_registry.py
      - name: Exercise real TXT and CSV add/remove/read/download UI
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/w2a_file_scenarios.py
          python3 .github/scripts/w2a_file_scenarios.py
      - name: Report per-file-case PASS FAIL BLOCKED without hidden claims
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          p=Path(os.environ['RUNNER_TEMP'])/'hitel_file_scenario_results.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## HITEL real Chrome file scenarios (synthetic only)\n\n')
              if not p.exists():
                  f.write('BLOCKED: file scenario results unavailable after job failure.\n')
              else:
                  data=json.loads(p.read_text(encoding='utf-8'))
                  f.write('| ID | Action | Status | Safe proof |\n|---|---|---|---|\n')
                  for x in data['results']:
                      f.write(f"| {x['id']} | {x['name']} | {x['status']} | {x['detail']} |\n")
                  f.write('\n'+', '.join(f'{k}={v}' for k,v in data['summary'].items())+'\n')
          PY
      - name: Keep sanitized file-case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-chrome-file-scenario-results
          path: ${{ runner.temp }}/hitel_file_scenario_results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Make overall CI fail unless all individual file cases PASS
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,sys
          p=Path(os.environ['RUNNER_TEMP'])/'hitel_file_scenario_results.json'
          if not p.is_file():
              print('FAIL_FILE_SCENARIO_REPORT_MISSING')
              sys.exit(1)
          data=json.loads(p.read_text(encoding='utf-8'))
          failures=[r['id'] for r in data['results'] if r['status']!='PASS']
          if failures:
              print('FAIL_INCOMPLETE_FILE_SCENARIOS=' + ','.join(failures))
              sys.exit(1)
          print('PASS_ALL_FILE_SCENARIOS')
          PY

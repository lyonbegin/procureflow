name: ChatGPT - GitHub Chrome Web2API relay worker
# Start signed Chrome worker for the verified, externally typed free-text browser trial.

on:
  workflow_dispatch:
    inputs:
      work_minutes:
        description: "Run temporary GitHub Chrome worker for this many minutes"
        type: choice
        required: true
        default: "10"
        options:
          - "5"
          - "10"
          - "20"
  push:
    paths:
      - .github/workflows/chatgpt-web2api-relay-worker.yml
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: chatgpt-web2api-relay-worker
  cancel-in-progress: false

jobs:
  check-queued-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      start: ${{ steps.check.outputs.start }}
    steps:
      - name: Check whether a token-free Web2API test is awaiting Chrome
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
            echo PASS_INTERACTIVE_ACTIONS_RUN
            exit 0
          fi
          STATUS_FILE="$(mktemp)"
          if ! curl -fsSL --retry 2 --max-time 15 \
            https://chatgpt-relay-web-production.up.railway.app/demo/status \
            -o "$STATUS_FILE"; then
            echo "start=false" >> "$GITHUB_OUTPUT"
            echo SKIP_NO_VERIFIED_RELAY_STATUS
            exit 0
          fi
          QUEUE_FILE="$(mktemp)"
          curl -fsSL --retry 2 --max-time 15 \
            https://chatgpt-relay-web-production.up.railway.app/web/api/queue-status \
            -o "$QUEUE_FILE" || echo '{}' > "$QUEUE_FILE"
          if python3 - "$STATUS_FILE" "$QUEUE_FILE" <<'PY'
          import json,sys
          try:
              state=json.load(open(sys.argv[1],encoding='utf-8'))
              queue=json.load(open(sys.argv[2],encoding='utf-8'))
              assert state.get('server')=='online'
              assert state.get('workerConnected') is False
              assert state.get('testState')=='queued' or queue.get('pendingDemoWork') is True
          except Exception:
              sys.exit(1)
          PY
          then
            echo "start=true" >> "$GITHUB_OUTPUT"
            echo PASS_QUEUED_TEST_REQUEST_NEEDS_CHROME
          else
            echo "start=false" >> "$GITHUB_OUTPUT"
            echo SKIP_CHROME_NOT_NEEDED
          fi
  verify-github-identity:
    needs: check-queued-test
    if: needs.check-queued-test.outputs.start == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-web2api-relay-bridge-20261113
          path: bridge-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify genuine GitHub OIDC JWT against pinned relay trust policy
        run: |
          set -euo pipefail
          python3 -m pip install -q 'PyJWT[crypto]==2.10.1' websockets==13.1
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("bridge-source/chatgpt-android-relay/web").resolve()))
          sys.path.insert(0,str(Path(".github/scripts").resolve()))
          from gh_oidc import verify_worker_identity
          from w2a_relay_worker import get_oidc_token
          token = get_oidc_token()
          if not verify_worker_identity(token):
              raise SystemExit("FAIL_REAL_GITHUB_OIDC_CLAIMS")
          print("PASS_REAL_SIGNED_GITHUB_OIDC_TRUST",flush=True)
          PY

  live-chrome-worker:
    if: needs.check-queued-test.outputs.start == 'true'
    needs: [verify-github-identity, check-queued-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      RELAY_WS_URL: wss://chatgpt-relay-web-production.up.railway.app/ws
      W2A_WORKER_SECONDS: ${{ inputs.work_minutes == '5' && '300' || inputs.work_minutes == '20' && '1200' || '1200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Restore two separate real ChatGPT profiles when saved, otherwise original single profile
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography playwright==1.56.0 websockets==13.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb
          ROOT="$RUNNER_TEMP/w2a-live-worker"
          mkdir -p "$ROOT" "$ROOT/download"
          chmod 700 "$ROOT"
          LATEST="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hitel-two-account-manual-login.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          DUAL=false
          if [ -n "$LATEST" ]; then
            mkdir -p "$ROOT/download/a" "$ROOT/download/b" \
              "$ROOT/profiles/a" "$ROOT/profiles/b"
            if gh run download "$LATEST" --repo "$GITHUB_REPOSITORY" \
                 --name hitel-chatgpt-account-a-encrypted --dir "$ROOT/download/a" \
                 >/dev/null 2>&1 \
                && gh run download "$LATEST" --repo "$GITHUB_REPOSITORY" \
                 --name hitel-chatgpt-account-b-encrypted --dir "$ROOT/download/b" \
                 >/dev/null 2>&1 \
                && test -s "$ROOT/download/a/account-a.bin" \
                && test -s "$ROOT/download/b/account-b.bin"; then
              if python3 .github/scripts/w2a_profile_crypto.py restore \
                   "$ROOT/download/a/account-a.bin" "$ROOT/profiles/a" \
                && python3 .github/scripts/w2a_profile_crypto.py restore \
                   "$ROOT/download/b/account-b.bin" "$ROOT/profiles/b" \
                && test -d "$ROOT/profiles/a/chrome-profile" \
                && test -d "$ROOT/profiles/b/chrome-profile"; then
                DUAL=true
                echo W2A_DUAL_PROFILES=1 >> "$GITHUB_ENV"
                echo PASS_DUAL_ENCRYPTED_ACCOUNT_PROFILES_RESTORED
              fi
            fi
          fi
          if [ "$DUAL" != true ]; then
            # Backwards compatible with the previously proven single account.
            gh run download 43353952660 --repo "$GITHUB_REPOSITORY" \
              --name chatgpt-web2api-encrypted-profile \
              --dir "$ROOT/download" >/dev/null
            test -s "$ROOT/download/secure-profile.bin"
            python3 .github/scripts/w2a_profile_crypto.py restore \
              "$ROOT/download/secure-profile.bin" "$ROOT"
            test -d "$ROOT/chrome-profile"
            echo W2A_DUAL_PROFILES=0 >> "$GITHUB_ENV"
            echo PASS_LEGACY_ENCRYPTED_ACCOUNT_PROFILE_RESTORED
          fi
      - name: Start authenticated Chrome with private loopback CDP
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-live-worker"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          PROFILE="$ROOT/chrome-profile"
          if [ "${W2A_DUAL_PROFILES:-0}" = 1 ]; then
            PROFILE="$ROOT/profiles/a/chrome-profile"
          fi
          "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            https://chatgpt.com/ >"$ROOT/chrome.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null 2>&1; then
              echo PASS_CHROME_CDP_READY
              break
            fi
            if [ "$i" -eq 50 ]; then echo FAIL_CHROME_CDP_START; exit 1; fi
            sleep 2
          done
          if [ "${W2A_DUAL_PROFILES:-0}" = 1 ]; then
            Xvfb :100 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb-b.log" 2>&1 &
            sleep 3
            test -S /tmp/.X11-unix/X100
            DISPLAY=:100 "$CHROME_BINARY" --no-sandbox --disable-dev-shm-usage \
              --no-first-run --no-default-browser-check \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
              --user-data-dir="$ROOT/profiles/b/chrome-profile" \
              https://chatgpt.com/ >"$ROOT/chrome-b.log" 2>&1 &
            for i in $(seq 1 50); do
              if curl -fsS http://127.0.0.1:9223/json/version >/dev/null 2>&1; then
                echo PASS_SECOND_INDEPENDENT_CHROME_CDP_READY
                break
              fi
              if [ "$i" -eq 50 ]; then echo FAIL_CHROME_ACCOUNT_B_START; exit 1; fi
              sleep 2
            done
          fi
      - name: Confirm two saved sessions are genuine and distinct
        run: |
          set -euo pipefail
          if [ "${W2A_DUAL_PROFILES:-0}" = 1 ]; then
            python3 .github/scripts/w2a_verify_two_profiles.py
          else
            python3 .github/scripts/w2a_verify_session.py
          fi
      - name: Launch the original, narrowly patched Web2API
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/w2a-live-worker"
          git clone -q https://github.com/MartinezS8/chatgpt-web2api.git "$ROOT/original"
          git -C "$ROOT/original" checkout -q 497527dceabfa3f95961e23c291e618c5570f1ac
          python3 .github/scripts/w2a_patch_vendor_dom.py "$ROOT/original"
          python3 -m pip install -q "$ROOT/original"
          chatgpt-web2api --port 18080 --host 127.0.0.1 --cdp-port 9222 \
            >"$ROOT/web2api.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS --max-time 4 http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo PASS_ORIGINAL_WEB2API_HEALTH
              break
            fi
            if [ "$i" -eq 50 ]; then echo FAIL_ORIGINAL_WEB2API_START; exit 1; fi
            sleep 2
          done
          if [ "${W2A_DUAL_PROFILES:-0}" = 1 ]; then
            DISPLAY=:100 chatgpt-web2api --port 18081 --host 127.0.0.1 --cdp-port 9223 \
              >"$ROOT/web2api-b.log" 2>&1 &
            for i in $(seq 1 50); do
              if curl -fsS --max-time 4 http://127.0.0.1:18081/health >/dev/null 2>&1; then
                echo PASS_SECOND_ACCOUNT_WEB2API_HEALTH
                break
              fi
              if [ "$i" -eq 50 ]; then echo FAIL_SECOND_ACCOUNT_WEB2API_START; exit 1; fi
              sleep 2
            done
          fi
      - name: Run temporary Web2API-to-Railway relay worker
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          python3 .github/scripts/w2a_relay_worker.py

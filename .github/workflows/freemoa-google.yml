name: Freemoa Headless Google Login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freemoa-google.yml"
      - "tools/freemoa_headless_google.py"
      - "tools/freemoa_google_login.py"
      - "tests/test_freemoa_headless_google.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe checks Google link; crawl reuses the Freemoa session Secret"
        type: choice
        required: true
        default: crawl
        options: [probe, crawl]

permissions:
  contents: read

jobs:
  google-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RUN_MODE: ${{ inputs.mode || 'crawl' }}
      FREEMOA_SESSION_B64: ${{ secrets.FREEMOA_SESSION_B64 }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use preinstalled Google Chrome
        run: |
          pip install playwright==1.56.0
          google-chrome --version
      - name: Test headless Google button
        run: python -m unittest discover -s tests -p 'test_freemoa_headless_google.py' -v
      - name: Run actual headless browser
        run: |
          python -m tools.freemoa_headless_google \
            --mode "$RUN_MODE" \
            --limit 10 \
            --output artifacts/freemoa-google
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freemoa-google-${{ github.run_number }}
          path: |
            artifacts/freemoa-google/login_status.json
          if-no-files-found: warn
          retention-days: 7

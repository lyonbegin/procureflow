name: Build ChatGPT Android Relay APK
on:
  push:
    branches:
      - feature/chatgpt-android-relay-20261110
    paths:
      - 'chatgpt-android-relay/android/**'
      - '.github/workflows/build-chatgpt-relay-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle --no-daemon -p chatgpt-android-relay/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Relay-Control-APK
          path: chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build ChatGPT Android Relay APK
on:
  push:
    branches:
      - feature/chatgpt-android-relay-20261110
    paths:
      - 'chatgpt-android-relay/android/**'
      - '.github/workflows/build-chatgpt-relay-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle --no-daemon -p chatgpt-android-relay/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Relay-Control-APK
          path: chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK for direct Railway download
        run: |
          mkdir -p chatgpt-android-relay/web/static
          cp chatgpt-android-relay/android/app/build/outputs/apk/debug/app-debug.apk chatgpt-android-relay/web/static/ChatGPT-Relay-Control.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f chatgpt-android-relay/web/static/ChatGPT-Relay-Control.apk
          if git diff --cached --quiet; then
            echo "APK already matches published version"
          else
            git commit -m "build: publish installable controller APK for direct download"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

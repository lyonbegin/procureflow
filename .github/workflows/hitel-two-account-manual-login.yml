name: HITEL - register and cache multiple ChatGPT accounts in Chrome

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/remote-login/start-signal.txt
  # On-demand only: explicitly updating this marker starts one Chrome login.

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: hitel-two-manual-chatgpt-login
  cancel-in-progress: true

jobs:
  chrome-session:
    name: Register and encrypt independent ChatGPT browser profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 53
    env:
      GH_TOKEN: ${{ github.token }}
      FREEMOA_GOOGLE_PASSWORD: ${{ secrets.FREEMOA_GOOGLE_PASSWORD }}
      W2A_ACCESS_SHA256: 1789e3727b1b0f39967a7c79d88ef5cf63d1b987c6d41f6a53253e25cdc7a1b3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install free remote-browser dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -q cryptography playwright==1.56.0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth x11vnc novnc websockify nginx
          python3 -m py_compile .github/scripts/w2a_multi_login_gateway.py .github/scripts/w2a_profile_crypto.py .github/scripts/w2a_account_runtime.py
          test -f /usr/share/novnc/vnc.html
          test -n "$FREEMOA_GOOGLE_PASSWORD"
          echo PASS_EXISTING_SECRET_NO_ADDITIONAL_W2A_PASSWORD
      - name: Launch protected screen for registering multiple real ChatGPT accounts
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hitel-two-accounts"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          export W2A_MULTI_ROOT="$ROOT"
          # Import only previously AES-GCM encrypted per-account profiles.
          PREVIOUS="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hitel-two-account-manual-login.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            mkdir -p "$ROOT/prior"
            if gh run download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
               --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT/prior" \
               >/dev/null 2>&1 && test -s "$ROOT/prior/registry.bin"; then
              cp "$ROOT/prior/registry.bin" "$ROOT/registry.bin"
              find "$ROOT/prior" -maxdepth 1 -type f -name 'account-*.bin' \
                -exec cp '{}' "$ROOT/" \;
              echo PASS_PRIOR_ENCRYPTED_PROFILES_RESTORED
            fi
          fi
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$ROOT/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99
          python3 .github/scripts/w2a_multi_login_gateway.py >"$ROOT/gateway.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8899/health >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 45 ]; then echo FAIL_ACCOUNT_GATEWAY_START; exit 1; fi
            sleep 1
          done
          echo PASS_MULTI_ACCOUNT_LOGIN_GATEWAY_STARTED

          x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw -quiet \
            >"$ROOT/x11vnc.log" 2>&1 &
          websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900 \
            >"$ROOT/websockify.log" 2>&1 &
          cat >"$ROOT/nginx.conf" <<'NGINX'
          worker_processes 1;
          pid /tmp/hitel-two-accounts-nginx.pid;
          events { worker_connections 512; }
          http {
            access_log off;
            server {
              listen 127.0.0.1:8088;
              server_tokens off;
              proxy_set_header Host $http_host;
              location = /grant { proxy_pass http://127.0.0.1:8899; }
              location = /_auth {
                internal;
                proxy_pass http://127.0.0.1:8899/verify;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header Cookie $http_cookie;
              }
              location = / { auth_request /_auth; proxy_pass http://127.0.0.1:8899; }
              location = /status { auth_request /_auth; proxy_pass http://127.0.0.1:8899; }
              location = /save {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:8899;
                proxy_read_timeout 120s;
              }
              location = /add {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:8899;
                proxy_read_timeout 45s;
              }
              location = /done {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:8899;
                proxy_read_timeout 120s;
              }
              location = /prepare-google {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:8899;
                proxy_read_timeout 60s;
              }
              location = /finish {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:8899;
                proxy_read_timeout 120s;
              }
              location / {
                auth_request /_auth;
                proxy_pass http://127.0.0.1:6080;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 1200s;
                proxy_buffering off;
              }
            }
          }
          NGINX
          nginx -t -c "$ROOT/nginx.conf"
          nginx -c "$ROOT/nginx.conf" -g 'daemon off;' >"$ROOT/nginx.log" 2>&1 &
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/)" = 401
          echo PASS_REMOTE_CHROME_PROTECTED

          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$ROOT/cloudflared"
          chmod 700 "$ROOT/cloudflared"
          "$ROOT/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8088 \
            >"$ROOT/tunnel.log" 2>&1 &
          TUNNEL=""
          for i in $(seq 1 70); do
            TUNNEL="$(grep -Eo 'https://[a-z0-9-]+[.]trycloudflare[.]com' "$ROOT/tunnel.log" | tail -n 1 || true)"
            if [ -n "$TUNNEL" ]; then break; fi
            sleep 2
          done
          test -n "$TUNNEL" || { echo FAIL_PROTECTED_REMOTE_URL; exit 1; }
          for i in $(seq 1 25); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$TUNNEL/grant" || true)"
            if [ "$STATUS" = 200 ]; then break; fi
            if [ "$i" -eq 25 ]; then echo FAIL_REMOTE_LOGIN_SCREEN_UNREACHABLE; exit 1; fi
            sleep 3
          done
          PROTECTED_URL="$TUNNEL/grant"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=hitel-two-manual-chrome-logins \
            -f target_url="$PROTECTED_URL" \
            -f description='Protected A/B Chrome login screen ready; private access code required' \
            >/dev/null
          echo PASS_REMOTE_MULTI_ACCOUNT_LOGIN_LINK_READY
          echo REMOTE_MULTI_ACCOUNT_LOGIN_URL="$PROTECTED_URL"

          for i in $(seq 1 510); do
            if [ -f "$ROOT/registration-complete.flag" ]; then break; fi
            sleep 5
          done
          # Even if the user does not tap finish, retain verified and encrypted
          # account profiles when the temporary session expires.
          test -s "$ROOT/registry.bin" || {
            echo FAIL_NO_REAL_CHATGPT_ACCOUNT_REGISTERED
            exit 2
          }
          COUNT="$(find "$ROOT" -maxdepth 1 -type f -name 'account-*.bin' | wc -l)"
          test "$COUNT" -ge 1
          echo PASS_MULTI_ACCOUNT_ENCRYPTED_PROFILES_READY_FOR_UPLOAD
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=hitel-two-manual-chrome-logins \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Registered ChatGPT accounts encrypted and saved' \
            >/dev/null
      - name: Upload encrypted ChatGPT account registry and profiles
        uses: actions/upload-artifact@v4
        with:
          name: hitel-chatgpt-encrypted-multi-profiles
          path: |
            ${{ runner.temp }}/hitel-two-accounts/registry.bin
            ${{ runner.temp }}/hitel-two-accounts/account-*.bin
          if-no-files-found: error
          retention-days: 90

name: React Flow Studio and Editable Workflow Engine
on:
  pull_request:
    paths:
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "main.py"
      - "g2b_dag_api.py"
      - "g2b_dag_core.py"
      - "g2b_node_lab.py"
      - "requirements.txt"
      - "tests/test_g2b_dag_core.py"
      - "tests/test_g2b_node_lab.py"
      - "tests/test_workflow_studio.py"
      - ".github/workflows/reactflow-studio-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "main.py"
      - "tests/test_workflow_studio.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React Flow app dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify 104 graph functions and UI helpers
        working-directory: frontend
        run: npm test
      - name: Build React Flow production app
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing FastAPI and tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Stage static assets
        run: mkdir -p static/studio && cp -R frontend/dist/. static/studio/
      - name: Test full screen UI, 104 APIs, lab, DAG and debugging
        run: python -m pytest -q tests/test_workflow_studio.py tests/test_g2b_feature_api.py tests/test_g2b_workflow_ops.py tests/test_g2b_node_lab.py tests/test_g2b_dag_core.py
      - name: Compile existing API and Worker
        run: python -m py_compile main.py worker.py g2b_feature_api.py g2b_feature_data.py g2b_workflow_ops.py g2b_node_lab.py g2b_dag_core.py g2b_dag_api.py

name: HITEL launch signed v4 worker for two previously linked rooms once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-launch-v4-prewarm-once-20261120.yml
permissions:
  contents: read
  actions: write
jobs:
  launch-existing-signed-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger EXACT existing worker-only workflow one time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hitel-integration-bridge-live-qa.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=worker_only \
            -f run_minutes=240 \
            -f pairing_code=''
          echo "PASS_DISPATCH_EXISTING_SIGNED_V4_WORKER_ONLY"
          echo "NO_NEW_RAILWAY_SERVICE_NO_SCHEDULE_NO_CHATGPT_MESSAGE"

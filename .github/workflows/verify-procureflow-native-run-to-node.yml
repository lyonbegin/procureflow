name: ProcureFlow native n8n true run-to-node smoke
on:
  push:
    branches: [feat/n8n-native-editable-procurement-20261028]
    paths:
      - n8n/native-editor/runner/**
      - n8n/native-editor/Caddyfile
      - .github/workflows/verify-procureflow-native-run-to-node.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual-run-to-node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Execute actual n8n S01 first node and then second node
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root='https://procureflow-n8n-native-canvas-production.up.railway.app';
          const w=JSON.parse(readFileSync('n8n/workflows/S01.json','utf8'));
          const byName=new Map(w.nodes.map(n=>[n.name,n]));
          const order=[];
          const incoming=new Set(Object.values(w.connections).flatMap(o=>Object.values(o).flat(2).map(n=>n.node)));
          let cur=w.nodes.find(n=>!incoming.has(n.name))?.name;
          while(cur && !order.includes(cur)){order.push(cur);const a=w.connections[cur];cur=a?Object.values(a).flat(2)[0]?.node:null;}
          if(order.length!==w.nodes.length)throw Error('S01 expected to be linear');
          const call=async n=>{
            const url=root+'/api/demo-run/run-step/S01/'+String(n).padStart(2,'0');
            const r=await fetch(url,{method:'POST',headers:{Origin:root},signal:AbortSignal.timeout(110000)});
            const t=await r.text();
            let j;try{j=JSON.parse(t)}catch{throw Error('Invalid status '+r.status+': '+t.slice(0,150))}
            console.log('NATIVE_STEP_'+n,r.status,JSON.stringify(j).slice(0,2000));
            if(!r.ok||!j.success||!j.lastStepCompleted||
               j.stepIndex!==n||j.targetNode!==order[n-1]||
               j.executedNodes.length!==n||
               !j.executedNodes.every((v,i)=>v===order[i])||
               !j.ancestorsReexecuted||j.bidSubmitted!==false)
              throw Error('Step '+n+' was not actually executed in native n8n');
            return j;
          };
          await call(1); await call(2);
          console.log('NATIVE_PREFIX_STEP_ONE_TWO_EXECUTION_PASS');
          NODE
      - name: Deny out-of-bounds and arbitrary workflows
        run: |
          node --input-type=module <<'NODE'
          const root='https://procureflow-n8n-native-canvas-production.up.railway.app';
          const results=await Promise.all([
            fetch(root+'/api/demo-run/run-step/S01/99',{method:'POST',headers:{Origin:root}}),
            fetch(root+'/api/demo-run/run-step/PF01/01',{method:'POST',headers:{Origin:root}})
          ]);
          if(results.some(r=>r.ok))throw Error('Invalid step/workflow accepted');
          console.log('STEP_RESTRICTED_TEST_PASSED',results.map(r=>r.status));
          NODE

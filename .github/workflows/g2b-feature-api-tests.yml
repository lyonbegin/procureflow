name: G2B 104 Individual API Contracts
on:
  pull_request:
    paths:
      - "g2b_feature_api.py"
      - "g2b_node_lab.py"
      - "tests/test_g2b_node_lab.py"
      - "g2b_workflow_ops.py"
      - "tests/test_g2b_workflow_ops.py"
      - "g2b_feature_data.py"
      - "g2b_documents.py"
      - "g2b_feature_registry.py"
      - "g2b_case_engine.py"
      - "main.py"
      - "worker.py"
      - "tests/test_g2b_feature_api.py"
      - "static/g2b-feature-api.html"
      - ".github/workflows/g2b-feature-api-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test requirements
        run: pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Compile all involved modules
        run: python -m py_compile main.py worker.py g2b_feature_api.py g2b_feature_data.py g2b_node_lab.py g2b_workflow_ops.py g2b_documents.py g2b_feature_registry.py g2b_case_engine.py
      - name: Verify 104 individual endpoints and parameter protections
        run: python -m pytest -q tests/test_g2b_feature_api.py tests/test_g2b_workflow_ops.py tests/test_g2b_node_lab.py

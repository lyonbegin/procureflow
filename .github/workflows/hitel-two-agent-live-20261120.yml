name: HITEL two LIVE ChatGPT agents HTTP-only isolation check

# ONE-TIME push activation when this workflow is first added. No production
# Railway deployment, no existing A/Scribd room mutation, no Chrome.
# Missing user-approved Codex OAuth GitHub secret -> hard FAIL, never fake PASS.
on:
  push:
    branches:
      - feature/hitel-browserless-web2api-20261120
    paths:
      - .github/workflows/hitel-two-agent-live-20261120.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitel-live-two-agent-oneoff
  cancel-in-progress: false

jobs:
  actual-chatgpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GPTWEB_TRANSPORT_MODE: direct
      GPTWEB_BROWSER_RELAY_URL: ''
      GPTWEB_LISTEN: 127.0.0.1:8787
      GPTWEB_UPSTREAM_MAX_RETRIES: '0'
      PINNED_GPTWEB2API_SHA: 985f4f45a49fbfdb2f8524686ab25759fd5195bb
      HITEL_DIRECT_CREDENTIALS_JSON_B64: ${{ secrets.HITEL_DIRECT_CREDENTIALS_JSON_B64 }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require existing Codex OAuth authorization, never Chrome session
        run: |
          set -euo pipefail
          if [[ -z "$HITEL_DIRECT_CREDENTIALS_JSON_B64" ]]; then
            echo "LIVE_QA_BLOCKED_NO_CODEX_OAUTH_SECRET: cannot test real ChatGPT without valid user-authorized OAuth credentials"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/auth"
          printf '%s' "$HITEL_DIRECT_CREDENTIALS_JSON_B64" | base64 --decode > "$RUNNER_TEMP/auth/auth.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'auth/auth.json').read_text('utf-8'))
          tokens=data.get('tokens',data)
          if not isinstance(tokens,dict) or not isinstance(tokens.get('access_token'),str) or not tokens['access_token']:
              raise SystemExit('LIVE_QA_BLOCKED_INVALID_OAUTH_FILE')
          print('PASS_OAUTH_FILE_FORMAT_PRESENT_TOKENS_REDACTED')
          PY
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "GPTWEB_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "GPTWEB_OAUTH_TOKEN_FILE=$RUNNER_TEMP/auth/auth.json" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build original browserless Web2API at pinned commit
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/5yu4n/gptweb2api.git "$RUNNER_TEMP/gptweb2api"
          git -C "$RUNNER_TEMP/gptweb2api" checkout -q "$PINNED_GPTWEB2API_SHA"
          test "$(git -C "$RUNNER_TEMP/gptweb2api" rev-parse HEAD)" = "$PINNED_GPTWEB2API_SHA"
          cd "$RUNNER_TEMP/gptweb2api"
          go build -trimpath -o "$RUNNER_TEMP/gptweb2api-direct" ./cmd/gptweb2api
          echo "PASS_REAL_GATEWAY_GO_BINARY_PINNED"
      - name: Launch real direct-only HTTP backend (no browser fallback)
        run: |
          set -euo pipefail
          test "$GPTWEB_TRANSPORT_MODE" = direct
          test -z "$GPTWEB_BROWSER_RELAY_URL"
          "$RUNNER_TEMP/gptweb2api-direct" >"$RUNNER_TEMP/real-gateway-redacted.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then
              echo PASS_REAL_DIRECT_HTTP_PROCESS_STARTED
              break
            fi
            if [[ "$i" -eq 45 ]]; then
              echo FAIL_REAL_DIRECT_HTTP_PROCESS_START
              exit 1
            fi
            sleep 1
          done
      - name: Two synthetic live ChatGPT rooms, 12 turns each, really concurrent
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python3 .github/scripts/hitel_direct_two_agents_live_qa.py
      - name: Truthful qualification summary
        if: always()
        run: |
          echo "## Actual ChatGPT Web parallel two-agent qualification" >> "$GITHUB_STEP_SUMMARY"
          echo "This check uses NO Chrome or browser fallback." >> "$GITHUB_STEP_SUMMARY"
          echo "Only 2 new isolated QA rooms may be written; existing real research rooms are excluded." >> "$GITHUB_STEP_SUMMARY"
          echo "Success requires 24 real ChatGPT replies with exact unique token, stable conversation IDs, and verified final parents." >> "$GITHUB_STEP_SUMMARY"
          echo "Missing OAuth secret or HTTP 429 results in FAIL/UNVERIFIED, not a synthetic PASS." >> "$GITHUB_STEP_SUMMARY"

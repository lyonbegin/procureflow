name: n8n Single Engine + Ten Native Scenario Workflows
on:
  pull_request:
    paths:
      - "n8n/**"
      - "docker-compose.n8n.yml"
      - "n8n_scenarios.py"
      - "n8n_operational.py"
      - "n8n_job_bridge.py"
      - "n8n_native_probe.py"
      - "tests/test_n8n_native_probe.py"
      - "tests/test_n8n_job_bridge.py"
      - "n8n_landing.py"
      - "main.py"
      - "Dockerfile"
      - "g2b_feature_api.py"
      - "tests/test_n8n_**.py"
      - "scripts/qa_n8n_code_nodes.cjs"
      - "scripts/qa_n8n_operational_nodes.cjs"
      - "scripts/qa_n8n_custom_node.cjs"
      - ".github/workflows/n8n-single-engine-tests.yml"
  push:
    branches: [main]
    paths:
      - "n8n/**"
      - "docker-compose.n8n.yml"
      - "n8n_scenarios.py"
      - "n8n_landing.py"
      - "main.py"
      - "Dockerfile"
      - "scripts/qa_n8n_code_nodes.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute exact n8n exported Code-node JavaScript (no mock implementations)
        run: |
          node scripts/qa_n8n_code_nodes.cjs
          node scripts/qa_n8n_operational_nodes.cjs
          node scripts/qa_n8n_custom_node.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python API/test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Compile n8n scenario backend and original G2B business APIs
        run: python -m py_compile main.py n8n_scenarios.py n8n_native_probe.py n8n_operational.py n8n_job_bridge.py n8n_landing.py g2b_feature_api.py g2b_node_lab.py worker.py
      - name: Verify all ten n8n workflows, scenario API and retired React Flow
        run: python -m pytest -q tests/test_n8n_scenarios.py tests/test_n8n_native_probe.py tests/test_n8n_job_bridge.py tests/test_n8n_operational.py tests/test_n8n_only_migration.py tests/test_g2b_feature_api.py tests/test_g2b_node_lab.py
      - name: Validate compose configuration (when Docker available)
        env:
          N8N_DB_PASSWORD: ci-fake-not-used
          N8N_ENCRYPTION_KEY: ci-fake-not-used
        run: docker compose -f docker-compose.n8n.yml config --quiet

  n8n-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Import all 10 exported JSON workflows with actual n8n 2.44.6 CLI
        run: |
          docker run --rm \
            --env N8N_ENCRYPTION_KEY=ci-only-demo-key-not-for-production \
            --volume "${PWD}/n8n/workflows:/demo-workflows:ro" \
            docker.n8n.io/n8nio/n8n:2.44.6 \
            import:workflow --separate --input=/demo-workflows

  n8n-operational-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify n8n 2.44.6 imports all FIFTEEN live-data PF workflows
        run: |
          docker run --rm \
            --env N8N_ENCRYPTION_KEY=ci-operational-validation-do-not-reuse \
            --volume "${PWD}/n8n/operational:/operational-workflows:ro" \
            docker.n8n.io/n8nio/n8n:2.44.6 \
            import:workflow --separate --input=/operational-workflows

  custom-node-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Build dedicated n8n image with 104 business functions
        run: docker build -f n8n/Dockerfile -t procureflow-native-n8n:test .
      - name: Verify bundled official business nodes and 25 native workflows exist
        run: |
          docker run --rm --entrypoint /bin/sh procureflow-native-n8n:test \
            -c 'test -f /home/node/.n8n/custom/node_modules/n8n-nodes-procureflow/dist/nodes/ProcureFlow.node.js && \
                 test -f /home/node/procureflow-operational-workflows/PF15.json && \
                 test -f /home/node/procureflow-demo-workflows/S10.json && \
                 echo N8N_25_NATIVE_WORKFLOWS_AND_104_FEATURE_NODE_BUNDLED'

  n8n-real-cli-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run ALL 10 native workflows in real n8n CLI, including live read-only QA HTTP calls
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            -e N8N_ENCRYPTION_KEY=ci-only-real-execution-discarded-on-exit \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -v "${PWD}/n8n/workflows:/demo-workflows:ro" \
            docker.n8n.io/n8nio/n8n:2.44.6 \
            -c 'set -eu
              n8n import:workflow --separate --input=/demo-workflows
              for i in 01 02 03 04 05 06 07 08 09 10; do
                id="PFDEMO2026S${i}WF"
                echo "N8N_NATIVE_EXECUTION_START: S${i}"
                n8n execute --id="${id}"
                echo "N8N_NATIVE_EXECUTION_SUCCESS: S${i}"
              done
              echo "N8N_NATIVE_10_EXECUTIONS_COMPLETED"'

  n8n-live-pf-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Import and run native PF01-PF15 against live read-only G2B evidence
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e N8N_ENCRYPTION_KEY=temporary-test-only \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -v "${PWD}/n8n/operational:/pf-operational:ro" \
            docker.n8n.io/n8nio/n8n:2.44.6 \
            -c 'set -eu
              n8n import:workflow --separate --input=/pf-operational
              for x in 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15; do
                echo "N8N_PF_START PF${x}"
                n8n execute --id="PFOP2026PF${x}WF" > "/tmp/PF${x}.txt" 2>&1
                grep -q "Execution was successful:" "/tmp/PF${x}.txt" || { tail -80 "/tmp/PF${x}.txt"; exit 1; }
                grep -q "business_state" "/tmp/PF${x}.txt" || { tail -80 "/tmp/PF${x}.txt"; exit 1; }
                echo "N8N_PF_PASSED PF${x}"
              done
              echo "N8N_REAL_DATABASE_PF01_PF15_EXECUTED"'

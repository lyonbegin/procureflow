name: Fresh G2B Mobile FastAPI Search Tests
on:
  push:
    branches: [feature/g2b-mobile-fastapi-search-20261106]
    paths:
      - fresh_mobile_api.py
      - fresh_mobile_tests.py
      - fresh_g2b_api.py
      - fresh_g2b_store.py
      - Dockerfile.fresh-g2b
      - .github/workflows/fresh-mobile-fastapi-tests.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet fastapi==0.115.12 "psycopg[binary]==3.2.9" playwright==1.52.0 pypdf==5.7.0 olefile==0.47
      - run: python -m py_compile fresh_mobile_api.py fresh_g2b_api.py fresh_g2b_store.py
      - run: python -m unittest -v fresh_mobile_tests fresh_g2b_tests

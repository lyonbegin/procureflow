name: Real Android emulator verification (official ChatGPT only)
on:
  push:
    branches: [feature/chatgpt-android-relay-20261110]
    paths:
      - '.github/workflows/test-chatgpt-real-emulator.yml'
      - '.github/scripts/fetch-exact-chatgpt.mjs'
      - '.github/scripts/check-chatgpt-variant.py'
      - '.github/scripts/test-chatgpt-real-emulator.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-android:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CHATGPT_TEST_APK_URL: ${{ secrets.CHATGPT_TEST_APK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install download clients for exact APKM variant
        run: npm install --prefix .github/scripts --no-save apkmirror-downloader @nirewen/apkcombo-downloader
      - name: Retrieve matching OpenAI-signed APKM without publishing copyrighted APK
        run: |
          mkdir -p emulator-evidence
          set -o pipefail
          node .github/scripts/fetch-exact-chatgpt.mjs 2>&1 | tee emulator-evidence/public-download.log
      - name: Check Android virtualization availability
        run: |
          set -eu
          uname -a
          ls -l /dev/kvm || { echo 'ERROR: KVM not available'; exit 1; }
          sudo chmod 666 /dev/kvm
      - name: Boot REAL Android emulator and install REAL applications
        env:
          CHATGPT_TEST_APK_LOCAL: /tmp/chatgpt-download.pkg
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/test-chatgpt-real-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-android-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn

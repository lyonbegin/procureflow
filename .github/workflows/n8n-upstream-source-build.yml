name: Build official n8n GitHub source - isolated
on:
  push:
    branches:
      - feat/n8n-upstream-source-build-20261027
    paths:
      - n8n/source-build/**
      - .github/workflows/n8n-upstream-source-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build from original n8n GitHub source (pinned SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: n8n/source-build/Dockerfile
          tags: procureflow-n8n-source:ci
          push: false
          load: true
      - name: Verify source-built runtime CLI and shipped workflows
        run: |
          set -euo pipefail
          docker run --rm --entrypoint n8n procureflow-n8n-source:ci --version | grep -qx "2.44.6"
          test "$(find n8n/operational -maxdepth 1 -name 'PF*.json' | wc -l)" = 15
          test "$(find n8n/workflows -maxdepth 1 -name 'S*.json' | wc -l)" = 10
          echo "SOURCE_BUILT_N8N_VERSION_AND_25_WORKFLOW_FILES_VERIFIED"

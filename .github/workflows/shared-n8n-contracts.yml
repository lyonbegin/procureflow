name: Shared n8n 50-kind / 43-block contract audit (isolated)
on:
  pull_request:
    paths:
      - 'n8n/source-build/shared-adapter-contracts.mjs'
      - 'n8n/source-build/debug-80-audit.mjs'
      - 'n8n/source-build/inspection-envelope-schemas.mjs'
      - 'reports/workflow_81_160_implementation_20261025.md'
      - 'n8n/operational_manifest.json'
      - '.github/workflows/shared-n8n-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-n8n-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact shared node catalog commit (separate from Pan patch pin)
        run: |
          git clone --filter=blob:none https://github.com/lyonbegin/shared-n8n-studio.git /tmp/shared-n8n-studio
          git -C /tmp/shared-n8n-studio checkout --detach f8870c6ce5fc6f0da30b64fa3c6d7ce9f50bd4a2
          test "$(git -C /tmp/shared-n8n-studio rev-parse HEAD)" = "f8870c6ce5fc6f0da30b64fa3c6d7ce9f50bd4a2"
      - name: Validate all 50 shared kinds and 43 ProcureFlow operation contracts
        run: |
          node n8n/source-build/shared-adapter-contracts.mjs \
            n8n/operational_manifest.json \
            /tmp/shared-n8n-studio/playground/src/node-catalog.js \
            shared-adapter-contracts.json
          node <<'NODE'
          const assert=require('node:assert/strict');
          const r=require('./shared-adapter-contracts.json');
          assert.equal(r.native.length,14);
          assert.equal(r.customReadOnly.length,1);
          assert.equal(r.customReadOnly[0].type,'CUSTOM.procureFlowBusinessOperation');
          assert.equal(r.customReadOnly[0].actualBusinessHandler,false);
          assert.equal(r.unimplemented.length,35);
          assert.equal(r.verification.unsupportedKindCount,35);
          assert.equal(r.verification.runnableBusinessHandlers,0);
          assert.equal(new Set([...r.native.map(x=>x.kind),
            ...r.customReadOnly.map(x=>x.kind),
            ...r.unimplemented.map(x=>x.kind)]).size,50);
          assert(r.unimplemented.every(x=>x.executable===false&&
            x.acceptance==='UNSUPPORTED_NO_EXECUTABLE_N8N_MAPPING'));
          assert(r.adapters.every(x=>!x.canDispatch&&!x.canBid&&!x.officialEvidenceVerified));
          console.log('SHARED_N8N_CAPABILITY_CLASSIFICATION_PASS',JSON.stringify({
            native:r.native.length,registeredReadOnly:r.customReadOnly.length,
            unsupported:r.unimplemented.length,runnableBusinessHandlers:0
          }));
          NODE
      - name: Generate 43 strict read-only inspection input/output JSON Schemas
        run: |
          node --check n8n/source-build/inspection-envelope-schemas.mjs
          node n8n/source-build/inspection-envelope-schemas.mjs \
            n8n/operational_manifest.json shared-inspection-envelope-schemas.json
          node <<'NODE'
          const assert=require('node:assert/strict');
          const a=require('./shared-inspection-envelope-schemas.json');
          const m=require('./n8n/operational_manifest.json');
          assert.equal(a.count,43);
          assert.equal(a.actualBusinessHandlersWithStrictPayloadSchemas,0);
          assert.equal(a.scope,'READ_ONLY_INSPECTION_NOT_BUSINESS_HANDLER');
          assert.deepEqual(new Set(a.schemas.map(x=>x.operationId)),
            new Set(m.blocks.map(x=>x.id)));
          for(const entry of a.schemas){
            assert.equal(entry.actualBusinessHandler,false);
            assert.equal(entry.inputParameters.additionalProperties,false);
            assert.equal(entry.outputItem.additionalProperties,false);
            assert.equal(entry.inputParameters.properties.operationId.const,entry.operationId);
            assert.equal(entry.outputItem.properties.operation_id.const,entry.operationId);
            assert.equal(entry.outputItem.properties.flow_id.const,entry.flowId);
            assert.equal(entry.outputItem.properties.bid_submitted.const,false);
            assert.equal(entry.outputItem.properties.worker_job_enqueued.const,false);
            assert.equal(entry.outputItem.properties.actual_business_handler_executed.const,false);
            assert.equal(entry.outputItem.properties.final_decision.const,'HOLD');
            assert(entry.outputItem.allOf.length===2);
            assert(entry.outputItem.required.includes('inspection_status'));
            assert(entry.outputItem.required.includes('output'));
          }
          console.log('INSPECTION_43_STRICT_ENVELOPES_PASS (business handlers still 0)');
          NODE
      - name: Audit 80 separate debugging requirements without claiming completion
        run: node n8n/source-build/debug-80-audit.mjs reports/workflow_81_160_implementation_20261025.md shared-debug-80-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-n8n-50-kind-43-block-contract-audit
          path: |
            shared-adapter-contracts.json
            shared-inspection-envelope-schemas.json
            shared-debug-80-audit.json

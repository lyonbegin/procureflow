name: HITEL cancel only redundant queued v4 worker
on:
  push:
    branches: [main]
    paths: [.github/workflows/hitel-cancel-duplicate-v4-20261120.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop-redundant-queued-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve already-running v4 worker and cancel ONLY redundant queued run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=44565791683
          STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET" --jq '.status')"
          echo "QUEUED_V4_RUN=$TARGET STATE=$STATE"
          if [[ "$STATE" == "pending" || "$STATE" == "queued" || "$STATE" == "in_progress" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET/force-cancel" > /dev/null
            echo "REDUNDANT_V4_WORKER_CANCELLATION_REQUESTED=$TARGET"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET" --jq '.status'

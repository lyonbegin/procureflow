name: G2B public pages quick Chrome snapshot
on:
  push:
    branches: [investigate/g2b-webview-capture-20261105]
    paths: [.github/workflows/g2b-webview-quick-20261105.yml]
permissions:
  contents: write
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture with system-installed Chrome (no downloads)
        shell: bash
        run: |
          mkdir -p g2b_quick_capture
          command -v google-chrome || true
          command -v chromium || true
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'NO_SYSTEM_CHROME' > g2b_quick_capture/error.txt; exit 0; fi
          for target in 'www.g2b.go.kr' 'm.g2b.go.kr' 'www.g2b.go.kr/tm/index.do' 'm.g2b.go.kr/tm/index.do'; do
            name=$(echo "$target" | sed 's/[^a-zA-Z0-9]/_/g')
            echo "TEST $target"
            timeout 25 "$CHROME" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=5000 --screenshot="g2b_quick_capture/${name}.png" --dump-dom "https://$target" > "g2b_quick_capture/${name}.html" 2>"g2b_quick_capture/${name}.stderr" || true
            python - "$name" "$target" <<'PY'
          import sys,re,html,pathlib,json
          name,target=sys.argv[1:]
          p=pathlib.Path('g2b_quick_capture')/(name+'.html')
          s=p.read_text(errors='replace')
          title=(re.search(r'<title[^>]*>(.*?)</title>',s,re.S|re.I) or [None,''])[1]
          safe=re.sub(r'<(script|style).*?</\1>','',s,flags=re.S|re.I)
          safe=re.sub(r'<[^>]+>',' ',safe)
          safe=html.unescape(re.sub(r'\s+',' ',safe))[:3000]
          print(json.dumps({'target':target,'title':title,'visible_text':safe,'dom_bytes':len(s)},ensure_ascii=False))
          (p.parent/(name+'.json')).write_text(json.dumps({'target':target,'title':title,'visible_text':safe,'dom_bytes':len(s)},ensure_ascii=False,indent=2))
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-quick-capture
          path: g2b_quick_capture/
          retention-days: 7
      - name: Save concise output to test branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A g2b_quick_capture/
          if ! git diff --cached --quiet; then
            git commit -m "test: record quick G2B browser screenshots [skip ci]"
            git push origin HEAD:investigate/g2b-webview-capture-20261105
          fi

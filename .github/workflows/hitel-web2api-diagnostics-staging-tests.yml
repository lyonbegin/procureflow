name: HITEL Web2API diagnostics staging - unit and syntax tests
on:
  push:
    branches: [fix/hitel-api-safe-web2api-diagnostics-20261119]
    paths:
      - '.github/scripts/safe_worker_error.py'
      - '.github/scripts/test_safe_worker_error.py'
      - '.github/scripts/w2a_relay_worker.py'
      - 'chatgpt-android-relay/web/integration_public.py'
      - 'chatgpt-android-relay/web/app.py'
      - 'chatgpt-android-relay/web/tests/test_worker_protocol_upgrade.py'
      - 'chatgpt-android-relay/web/tests/test_integration_public.py'
      - '.github/workflows/hitel-web2api-diagnostics-staging-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile patched worker and safe diagnostics without network
        run: |
          python3 -m py_compile .github/scripts/w2a_relay_worker.py
          python3 -m py_compile .github/scripts/safe_worker_error.py
      - name: Check secret-safe error classification
        run: python3 .github/scripts/test_safe_worker_error.py -v
      - name: Verify safe API public status and room/job isolation contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PUBLIC_SMOKE_ONLY: '1'
          WEB_SESSION_SIGNING_KEY: 'synthetic-local-test-key-only'
        run: |
          python3 -m pip install -q -r chatgpt-android-relay/web/requirements.txt
          python3 -m unittest discover -s chatgpt-android-relay/web/tests -p test_integration_public.py -v
      - name: Verify existing API contract, long waits, Chrome protocol and worker start
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PUBLIC_SMOKE_ONLY: '1'
          WEB_SESSION_SIGNING_KEY: 'synthetic-only-for-isolated-ci'
        run: |
          set -euo pipefail
          for test in test_integrations_api.py test_long_running_reply.py test_worker_protocol_upgrade.py test_worker_autostart.py test_worker_fresh_chat.py; do
            python3 -m unittest discover -s chatgpt-android-relay/web/tests -p "$test" -v
          done
      - name: Assert patched worker reports classified failures, not generic hides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('.github/scripts/w2a_relay_worker.py').read_text(encoding='utf-8')
          assert 'from safe_worker_error import classify_web2api_failure' in code
          assert 'reason = classify_web2api_failure(exc)' in code
          assert 'reason = "WEB2API_SEND_OR_VERIFY_FAILED"' not in code
          print('PASS_SAFE_WEB2API_FAILURE_DIAGNOSTICS_NO_PRODUCTION_DEPLOY')
          PY

name: HITEL Web2API - saved GitHub Chrome accounts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a saved account check or one real ChatGPT turn"
        required: true
        type: choice
        default: saved_account_status
        options:
          - saved_account_status
          - real_chat
      account_slot:
        description: "Saved account number (1, 2, 3...). Defaults to 1."
        required: true
        type: string
        default: "1"

# GitHub-only on demand; no Railway endpoints, push jobs, or schedules.
permissions:
  contents: read
  actions: read

jobs:
  saved-account-status:
    if: inputs.mode == 'saved_account_status'
    name: Check AES-GCM saved ChatGPT browser account files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HITEL_ACCOUNT_SLOT: ${{ inputs.account_slot || '1' }}
    steps:
      - name: Verify latest stored multi-account artifact without decrypting credentials
        run: |
          set -euo pipefail
          SLOT="$HITEL_ACCOUNT_SLOT"
          if ! [[ "$SLOT" =~ ^[1-9][0-9]{0,2}$ ]] || ((10#$SLOT > 100)); then
            echo FAIL_ACCOUNT_SLOT_INVALID
            exit 1
          fi
          ARTIFACT_RUN="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-chatgpt-encrypted-multi-profiles&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          test -n "$ARTIFACT_RUN" || {
            echo FAIL_NO_VERIFIED_ACCOUNT_ARTIFACT
            exit 1
          }
          ROOT="$RUNNER_TEMP/hitel-saved-accounts"
          mkdir -p "$ROOT"
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name hitel-chatgpt-encrypted-multi-profiles --dir "$ROOT" >/dev/null
          test -s "$ROOT/registry.bin" || {
            echo FAIL_ENCRYPTED_ACCOUNT_REGISTRY_MISSING
            exit 1
          }
          printf -v FILE 'account-%04d.bin' "$SLOT"
          test -s "$ROOT/$FILE" || {
            echo FAIL_SELECTED_CHATGPT_ACCOUNT_NOT_REGISTERED
            exit 1
          }
          COUNT="$(find "$ROOT" -maxdepth 1 -type f -name 'account-*.bin' | wc -l)"
          echo PASS_MULTI_CHATGPT_ENCRYPTED_PROFILES_PRESENT
          echo SAVED_ACCOUNT_COUNT="$COUNT"
          echo ACCOUNT_SLOT="$SLOT"
          {
            echo "## HITEL ChatGPT saved account"
            echo
            echo "- Encrypted browser profiles: **$COUNT**"
            echo "- Selected registered slot: **$SLOT**"
            echo "- Source: GitHub Actions encrypted artifact (not Railway)"
            echo "- This is a storage test. Live ChatGPT session verification requires **real_chat**."
          } >> "$GITHUB_STEP_SUMMARY"

  real-chat:
    if: inputs.mode == 'real_chat'
    name: Restore selected account and receive one REAL ChatGPT answer
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/chatgpt-web2api-verify-session.yml
    with:
      account_slot: ${{ inputs.account_slot }}
    secrets: inherit

name: HITEL two persistent WebSocket agents protocol regression

# Existing Railway source branch is not modified or deployed by this workflow.
# No external ChatGPT calls, new services, Codex, OAuth or GitHub secrets.
on:
  push:
    branches:
      - fix/hitel-agent-persistent-ws-routing-20261120
    paths:
      - .github/workflows/hitel-agent-persistent-ws-qa.yml
      - chatgpt-android-relay/web/integration_agent_stream.py
      - chatgpt-android-relay/web/app.py
      - tests/test_hitel_agent_persistent_ws.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ws-room-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only existing server framework for offline protocol QA
        run: python3 -m pip install -q fastapi==0.115.12
      - name: Verify modified existing production app and new WebSocket handler compile
        run: |
          python3 -m py_compile chatgpt-android-relay/web/app.py
          python3 -m py_compile chatgpt-android-relay/web/integration_agent_stream.py
      - name: Both independent agents send 24 different questions over persistent WebSockets
        run: |
          python3 -m unittest discover -s tests -p 'test_hitel_agent_persistent_ws.py' -v
      - name: Checkout current existing Web2API room-tab worker for regression only
        uses: actions/checkout@v4
        with:
          ref: fix/hitel-room-tab-isolation-20261120
          path: worker-qa
      - name: Verify protected four-slot vendor boot + composer lifecycle
        run: |
          python3 -m pip install -q websockets==13.1
          python3 -m unittest discover -s worker-qa/chatgpt-android-relay/web/tests -p 'test_multi_tab_worker.py' -v
      - name: Read exact safe reasons for previous two REAL ChatGPT failures without sending again
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,re
          base="https://hitel-integration-api-production.up.railway.app/integrations/v1/public"
          for agent in ("A","B"):
              request_id=f"HI_WS_REAL_44744688954_{agent}_1"
              req=urllib.request.Request(base+"/requests/"+request_id,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=16) as resp:
                      mapping=json.load(resp)
                  job_id=mapping["job_id"]
                  with urllib.request.urlopen(base+"/jobs/"+job_id,timeout=16) as resp:
                      job=json.load(resp)
                  def clean(v):
                      value=str(v or "")[:120]
                      return value if re.fullmatch(r"[A-Za-z0-9_.:-]{0,120}",value) else "REDACTED_NON_CODE"
                  print("HITEL_REAL_FAILURE_DIAG",agent,
                        "job="+clean(job_id),
                        "status="+clean(job.get("status")),
                        "stage="+clean(job.get("stage")),
                        "error_code="+clean(job.get("error_code")),
                        "safe_error_reason="+clean(job.get("error")),
                        flush=True)
              except Exception as exc:
                  print("HITEL_REAL_FAILURE_DIAG_FETCH_ERROR",agent,type(exc).__name__,flush=True)
          PY
      - name: Truthful scope
        if: always()
        run: |
          echo "## HITEL persistent agent sockets" >> "$GITHUB_STEP_SUMMARY"
          echo "Two full-duplex in-process WebSocket clients; one existing room per agent." >> "$GITHUB_STEP_SUMMARY"
          echo "Injected Web2API COMPOSER_UNAVAILABLE on A must not affect B." >> "$GITHUB_STEP_SUMMARY"
          echo "ChatGPT real Web2API transfer still requires separate live end-to-end verification." >> "$GITHUB_STEP_SUMMARY"

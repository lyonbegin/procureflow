name: ProcureFlow Crawl Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  crawl:
    name: Crawl ${{ matrix.site }} / ${{ matrix.section }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site: [wishket, freemoa, wanted]
        section: [projects, partners, portfolios]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate parsers without network
        run: python -m unittest discover -s tests -p 'test_crawl_probe.py' -v
      - name: Crawl real pages
        run: |
          python tools/crawl_probe.py \
            --site "${{ matrix.site }}" \
            --section "${{ matrix.section }}" \
            --limit 4 \
            --output artifacts/crawl-probe
      - name: Upload result JSON and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ matrix.site }}-${{ matrix.section }}-${{ github.run_number }}
          path: artifacts/crawl-probe/
          if-no-files-found: warn
          retention-days: 7

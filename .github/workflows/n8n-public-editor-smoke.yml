name: n8n Public Editor Gateway No-Basic-Auth Smoke
on:
  pull_request:
    paths:
      - ".github/workflows/n8n-public-editor-smoke.yml"
      - "n8n/editor-proxy/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-editor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify native editor has no redundant browser login prompt
        run: |
          set -euo pipefail
          BASE="https://procureflow-n8n-editor-gateway-production.up.railway.app"
          test "$(curl -fsS -o /tmp/n8n-gateway-health -w '%{http_code}' "${BASE}/healthz")" = "200"
          grep -qx "ok" /tmp/n8n-gateway-health
          status=$(curl -sS -o /tmp/n8n-editor -w '%{http_code}' "${BASE}/")
          echo "EDITOR_ROOT_HTTP=${status}"
          test "${status}" != "401"
          # Initial owner enrollment must stay blocked on the public gateway.
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${BASE}/setup")" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${BASE}/rest/owner/setup")" = "403"
          echo "NO_BROWSER_BASIC_AUTH_AND_PUBLIC_SETUP_BLOCKED"

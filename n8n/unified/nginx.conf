server {
    listen 3000;
    server_name _;
    client_max_body_size 3m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /fresh { return 302 /fresh/; }
    location = /history { return 302 /history/; }
    location ^~ /fresh/ { proxy_pass http://127.0.0.1:8002/; }
    location ^~ /history/ { proxy_pass http://127.0.0.1:8003/; }
    location ^~ /api/studio/ { proxy_pass http://127.0.0.1:3001; }
    location ^~ /api/procurement/ { proxy_pass http://127.0.0.1:3001; }
    location ^~ /api/investment/ { return 404; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:8001; }
    location / { proxy_pass http://127.0.0.1:3001; }
}
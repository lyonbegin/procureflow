<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>조달청 자동화 · n8n 원본 노드 플로우</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1825;color:#e8f1fa;font:14px system-ui,"Malgun Gothic",sans-serif}
header{height:76px;background:#152b3d;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #36506a;gap:14px}
h1{margin:0;font-size:17px}p{margin:4px 0 0;color:#acc5d3;font-size:12px}a{color:#abe5ff;text-decoration:none}
main{display:flex;height:calc(100vh - 76px)}aside{width:320px;min-width:250px;background:#112538;padding:15px 12px;overflow:auto;border-right:1px solid #36506a}
aside h2{font-size:13px;margin:12px 8px;color:#9ddcc6}button.flow{color:#c8ddeb;display:block;width:100%;padding:12px;border:0;border-radius:7px;background:transparent;text-align:left;cursor:pointer;margin:4px 0;font:inherit}
button.flow:hover{background:#234254}button.flow.active{background:#235d61;color:#fff;border-left:3px solid #54d6b0}
button.flow small{color:#9ab4c2;display:block;margin-top:4px}section{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{padding:11px 17px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #36506a}
#status{font-size:12px;color:#e8c584}.toolbar button{border:0;border-radius:6px;padding:9px 12px;font-weight:700;cursor:pointer;background:#a3edd0;color:#073d2b}.toolbar button.secondary{background:#2e465b;color:#e8f1fa}.toolbar .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}iframe{width:100%;flex:1;border:0;background:#f5f5f5}
@media(max-width:700px){aside{width:130px;min-width:130px;padding:7px}button.flow{font-size:12px;padding:8px}header{height:auto;min-height:75px}main{height:calc(100vh - 80px)}} 
</style></head><body>
<header><div><h1>n8n 원본 노드 플로우 · 조달청 자동화</h1><p>공식 n8n Vue 편집기 · 노드 추가·삭제·이동·연결·설정 · 브라우저 로컬 초안 저장 · 실행은 안전한 별도 검증</p></div>
<a href="https://procureflow-api-production.up.railway.app/" target="_blank" rel="noopener">조달청 자동화 메인</a></header>
<main><aside><h2>운영 플로우 (16)</h2><div id="operations"></div><h2>검증 시나리오 (10)</h2><div id="scenarios"></div></aside>
<section><div class="toolbar"><div><strong id="title">원본 n8n 편집기 캔버스</strong><p id="status" aria-live="polite">초기화 중…</p></div><div class="actions"><button id="openNativeCreator" type="button">+ 노드 선택·추가</button><button id="addSafeNoOp" type="button">+ NoOp 테스트 노드</button><button id="undoEdit" class="secondary" type="button">↶ 실행 취소</button><button id="redoEdit" class="secondary" type="button">↷ 다시 실행</button><button id="saveDraft" type="button">변경 저장</button><button id="exportDraft" class="secondary" type="button">JSON 내보내기</button><button id="resetDraft" class="secondary" type="button">원본 복원</button><button id="runNativeScenario" class="secondary" type="button" disabled>▶ 원본 가상 시나리오 전체 실행</button><button id="showNextNode" class="secondary" type="button" disabled>다음 노드까지 실제 실행</button><button id="runSelectedNode" class="secondary" type="button" disabled>선택 노드까지 실행</button><span id="runStatus" style="color:#a8d7f8;font-size:11px" aria-live="polite">실행은 S01~S10 원본 시나리오만 가능합니다. 편집 초안·실제 투찰은 실행하지 않습니다.</span><span style="font-size:11px;color:#abc6da">노드 클릭: 상세설정 · 드래그: 이동 · 연결선 핸들 드래그: 연결 · 선택 후 Delete: 삭제 · Ctrl+Z: 복원. 저장은 이 브라우저에만 유지됩니다.</span></div></div>
<iframe id="n8n-canvas" title="n8n 공식 Vue 노드 캔버스" src="/workflows/demo?canExecute=false&editable=true" referrerpolicy="same-origin"></iframe></section></main>
<script>
const flows=[["operational/PF00.json","PF00 · 전체 업무 조정·분기"],["operational/PF01.json","PF01 · 공고 상시 수집"],["operational/PF02.json","PF02 · 발주 등록·1차 심사"],["operational/PF03.json","PF03 · 분석 작업 할당"],["operational/PF04.json","PF04 · 공식 공고·첨부 처리"],["operational/PF05.json","PF05 · 10년 개찰·낙찰 전수"],["operational/PF06.json","PF06 · 발주기관·경쟁업체 분석"],["operational/PF07.json","PF07 · 입찰참가자격 검증"],["operational/PF08.json","PF08 · 공급업체·인력 조사"],["operational/PF09.json","PF09 · 원가·가격전략"],["operational/PF10.json","PF10 · 제안서·서류"],["operational/PF11.json","PF11 · 독립 원본·결과 감사"],["operational/PF12.json","PF12 · 입찰 참여 의사결정"],["operational/PF13.json","PF13 · 정정·분석버전 갱신"],["operational/PF14.json","PF14 · 전역 API·Worker 자원 통제"],["operational/PF15.json","PF15 · 장애 복구·상태 대조"],["scenarios/S01.json","S01 · 가상 테스트"],["scenarios/S02.json","S02 · 가상 테스트"],["scenarios/S03.json","S03 · 가상 테스트"],["scenarios/S04.json","S04 · 가상 테스트"],["scenarios/S05.json","S05 · 가상 테스트"],["scenarios/S06.json","S06 · 가상 테스트"],["scenarios/S07.json","S07 · 가상 테스트"],["scenarios/S08.json","S08 · 가상 테스트"],["scenarios/S09.json","S09 · 가상 테스트"],["scenarios/S10.json","S10 · 가상 테스트"]];
const frame=document.getElementById('n8n-canvas'),
  status=document.getElementById('status'),title=document.getElementById('title');
const draftKey=file=>'procureflow-native-edit-v1:'+file;
let lastNativeRun=null,playbackIndex=-1,currentNodeOrder=[],selectedNodeIndex=-1;
let ready=false,chosen=Math.max(0,Math.min(flows.length-1,Number(localStorage.getItem('procureflow-native-edit:last-flow'))||0)),pendingExport=false;
const buttons=flows.map(([file,label],i)=>{
 const b=document.createElement('button');b.type='button';b.className='flow';b.textContent=label;b.dataset.workflow=file;
 b.onclick=()=>select(i);
 (i<16?document.getElementById('operations'):document.getElementById('scenarios')).appendChild(b);
 return b;
});
function requestSnapshot(exportMode=false){
 if(!ready){status.textContent='n8n 편집기 초기화 중입니다.';return;}
 pendingExport=exportMode;
 status.textContent=exportMode?'현재 노드 데이터를 내보내는 중…':'수정된 원본 노드 데이터를 저장하는 중…';
 frame.contentWindow.postMessage(JSON.stringify({command:'saveTestWorkflow'}),location.origin);
}
function nativeEditCommand(command) {
  if(!ready){ status.textContent='n8n 원본 편집기 초기화 중입니다.';return; }
  status.textContent=command==='openNativeNodeCreator'
    ? 'n8n 원본 노드 검색창을 여는 중…'
    : '원본 n8n의 노드 추가 함수로 안전한 NoOp 노드 생성 중…';
  frame.contentWindow.postMessage(JSON.stringify({command}),location.origin);
}
document.getElementById('openNativeCreator').onclick=()=>nativeEditCommand('openNativeNodeCreator');
document.getElementById('addSafeNoOp').onclick=()=>nativeEditCommand('addNativeTestNode');
// Dispatch shortcuts inside the original n8n Vue iframe. The history
// itself remains managed by n8n's own historyStore, not by the portal.
function n8nHistoryKey(redo=false){
  if(!ready){status.textContent='원본 n8n 편집기 초기화 중…';return;}
  const childDocument=frame.contentWindow?.document;
  if(!childDocument){status.textContent='n8n 편집기 연결이 필요합니다.';return;}
  childDocument.dispatchEvent(new KeyboardEvent('keydown',{
    key:'z',code:'KeyZ',ctrlKey:true,shiftKey:redo,bubbles:true,cancelable:true,
  }));
  status.textContent=redo?'n8n 원본 다시 실행 요청 완료 · 실제 노드 변화를 확인하세요.':'n8n 원본 실행 취소 요청 완료 · 실제 노드 변화를 확인하세요.';
}
document.getElementById('undoEdit').onclick=()=>n8nHistoryKey(false);
document.getElementById('redoEdit').onclick=()=>n8nHistoryKey(true);
document.getElementById('saveDraft').onclick=()=>requestSnapshot();
document.getElementById('exportDraft').onclick=()=>requestSnapshot(true);
document.getElementById('resetDraft').onclick=()=>{
 if(!confirm('현재 테스트 초안을 삭제하고 GitHub 워크플로 원본을 다시 불러옵니까?'))return;
 localStorage.removeItem(draftKey(flows[chosen][0]));
 select(chosen);
};
async function runScenario(){
 if(chosen<16){document.getElementById('runStatus').textContent='운영 PF는 공개 시험 화면에서 실행할 수 없습니다.';return}
 const id=flows[chosen][0].split('/').at(-1).replace('.json','');
 const el=document.getElementById('runNativeScenario');
 const result=document.getElementById('runStatus');
 el.disabled=true;result.textContent=id+' 원본 데이터를 실제 n8n CLI로 실행 중입니다. 편집 초안은 전송하지 않습니다.';
 try{
   const r=await fetch('/api/demo-run/run/'+id,{method:'POST',cache:'no-store'});
   const body=await r.json();
   if(!r.ok||!body.success)throw Error(body.error||body.reason||body.logTail||'HTTP '+r.status);
   lastNativeRun=body;playbackIndex=-1;
   document.getElementById('showNextNode').disabled=chosen<16;
   result.textContent=id+' 실제 n8n 전체 실행 성공 · '+(body.executedNodes?.length||0)+'개 노드 완료. 다음 노드까지 실제 실행은 앞 단계부터 다시 시작합니다.';
 }catch(e){lastNativeRun=null;result.textContent=id+' 실행 실패: '+String(e.message||e).slice(0,260)}
 finally{el.disabled=chosen<16}
}
async function runToNode(step){
 if(chosen<16)return;
 const id=flows[chosen][0].split('/').at(-1).replace('.json','');
 if(step<1||step>currentNodeOrder.length)return;
 const buttons=[document.getElementById('showNextNode'),document.getElementById('runSelectedNode')];
 buttons.forEach(b=>b.disabled=true);
 const indicator=document.getElementById('runStatus');
 indicator.textContent='n8n 엔진에서 '+step+'/'+currentNodeOrder.length+'번 노드까지 실제 실행 중입니다 (선행 단계도 다시 실행).';
 try{
   const response=await fetch('/api/demo-run/run-step/'+id+'/'+String(step).padStart(2,'0'),{method:'POST',cache:'no-store'});
   const result=await response.json();
   if(!response.ok||!result.success||!result.lastStepCompleted)throw Error(result.error||result.reason||result.logTail||'HTTP '+response.status);
   if(result.targetNode!==currentNodeOrder[step-1])throw Error('원본 그래프와 실행 노드 불일치');
   lastNativeRun=result;playbackIndex=step-1;
   frame.contentWindow?.document?.querySelectorAll('.vue-flow__node').forEach(el=>{
     el.style.outline='';el.style.boxShadow='';
     if(el.textContent?.includes(result.targetNode)){el.style.outline='3px solid #fbbf24';el.style.boxShadow='0 0 18px #fbbf2488'}
   });
   indicator.textContent='n8n 실제 실행 성공 '+step+'/'+currentNodeOrder.length+' · '+result.targetNode+' · '+result.executedNodes.length+'개 완료. 앞 노드부터 다시 실행하는 방식입니다.';
 }catch(e){indicator.textContent='노드 실행 오류: '+String(e.message||e).slice(0,240)}
 finally{
   document.getElementById('showNextNode').disabled=chosen<16;
   document.getElementById('runSelectedNode').disabled=chosen<16||selectedNodeIndex<0;
 }
}
function nativeLinearOrder(w){
 const from=Object.keys(w.connections||{});
 const targets=new Set(from.flatMap(k=>Object.values(w.connections[k]).flat(2).map(x=>x.node)));
 let node=w.nodes.find(n=>!targets.has(n.name))?.name;
 const result=[];
 while(node&&!result.includes(node)){
   result.push(node);
   const children=Object.values(w.connections[node]||{}).flat(2).map(x=>x.node);
   if(children.length>1)return [];
   node=children[0];
 }
 return result.length===w.nodes.length?result:[];
}
function attachCanvasNodeSelection(){
 const doc=frame.contentWindow?.document;
 if(!doc||doc.__procureflowNodeSelectHook)return;
 doc.__procureflowNodeSelectHook=true;
 doc.addEventListener('click',e=>{
   const nodeEl=e.target?.closest?.('.vue-flow__node');
   if(!nodeEl||chosen<16)return;
   const index=currentNodeOrder.findIndex(name=>nodeEl.textContent?.includes(name));
   if(index<0)return;
   selectedNodeIndex=index;
   document.getElementById('runSelectedNode').disabled=false;
   document.getElementById('runStatus').textContent='선택한 노드: '+currentNodeOrder[index]+' · 이 단계까지 실제 실행할 수 있습니다 (앞 단계 재실행).';
 },true);
}
frame.addEventListener('load',()=>attachCanvasNodeSelection());
document.getElementById('runSelectedNode').onclick=()=>runToNode(selectedNodeIndex+1);
async function showNextNode(){
 if(chosen<16)return;
 const next=playbackIndex>=currentNodeOrder.length-1?1:playbackIndex+2;
 return runToNode(next);
}

document.getElementById('runNativeScenario').onclick=runScenario;
document.getElementById('showNextNode').onclick=showNextNode;
async function select(i){
 chosen=i;
 lastNativeRun=null;playbackIndex=-1;currentNodeOrder=[];selectedNodeIndex=-1;
 document.getElementById('runSelectedNode').disabled=true;
 document.getElementById('runNativeScenario').disabled=i<16;
 document.getElementById('showNextNode').disabled=i<16;
 document.getElementById('runStatus').textContent=i<16?'운영 PF 실제 실행은 인증된 정식 n8n에서만 수행합니다.':'원본 시나리오만 실제 n8n 엔진에서 실행합니다. 편집 초안은 실행하지 않습니다.';
 localStorage.setItem('procureflow-native-edit:last-flow',String(i));
 buttons.forEach((b,j)=>b.classList.toggle('active',j===i));
 title.textContent=flows[i][1];
 status.textContent='워크플로 불러오는 중…';
 try{
  let workflow;
  const draft=localStorage.getItem(draftKey(flows[i][0]));
  if(draft){
    workflow=JSON.parse(draft);
  }else{
    const response=await fetch('/demo-data/'+flows[i][0],{cache:'no-store'});
    if(!response.ok)throw Error('HTTP '+response.status);
    workflow=await response.json();
  }
  if(!Array.isArray(workflow.nodes)||!workflow.connections||typeof workflow.connections!=='object')throw Error('노드/연결 데이터 형식 오류');
  if(chosen!==i)return;
  currentNodeOrder=nativeLinearOrder(workflow);
  if(!ready){status.textContent='n8n 원본 편집기 준비 중…';return;}
  frame.contentWindow.postMessage(JSON.stringify({
    command:'openWorkflow',
    workflow:{...workflow,active:false},
    canOpenNDV:true,
    suppressNotifications:true
  }),location.origin);
  status.textContent=(draft?'저장된 초안 복원 완료 요청 · ':'원본 JSON 로드 요청 · ')+
      '노드 '+workflow.nodes.length+'개 · 변경 저장은 이 브라우저에서 유지되며 실제 입찰 제출은 실행되지 않습니다.';
 }catch(error){status.textContent='불러오기 오류: '+error.message;}
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==frame.contentWindow||typeof e.data!=='string')return;
 let data;try{data=JSON.parse(e.data);}catch{return;}
 if(data.command==='n8nReady'){ready=true;attachCanvasNodeSelection();select(chosen);}
 else if(data.command==='nativeTestUiResult'){
   if(data.error){status.textContent='원본 n8n 노드 추가 실패: '+data.error;}
   else if(data.action==='openNativeNodeCreator'){
     status.textContent=data.nodeCreatorOpen?'n8n 원본 노드 검색창이 열렸습니다. 원하는 노드를 선택하세요.':'원본 노드 검색창이 열리지 않았습니다.';
   }else{
     status.textContent='원본 n8n 노드 추가 호출 성공 · 현재 '+data.nodes+'개 · 저장하려면 변경 저장을 누르세요.';
   }
 }
 else if(data.command==='testWorkflowSnapshot'){
   if(!Array.isArray(data.workflow?.nodes)||!data.workflow?.connections){
      status.textContent='저장 오류: 노드 데이터를 받지 못했습니다.';return;
   }
   const workflow={...data.workflow,active:false};
   const filename=flows[chosen][0],json=JSON.stringify(workflow,null,2);
   try {
     if(pendingExport){
       const blob=new Blob([json],{type:'application/json'});
       const url=URL.createObjectURL(blob),a=document.createElement('a');
       a.href=url;a.download=filename.split('/').pop();a.click();
       setTimeout(()=>URL.revokeObjectURL(url),500);
       pendingExport=false;
       status.textContent='JSON 파일을 내보냈습니다. 서버에는 저장되지 않았습니다.';
     }else{
       localStorage.setItem(draftKey(filename),json);
       status.textContent='초안 저장 성공 · 노드 '+workflow.nodes.length+
       '개 · 이 브라우저에서 새로고침 후에도 유지됩니다.';
     }
   }catch(error){status.textContent='저장 실패: '+error.message;}
 }else if(data.command==='error'){status.textContent='원본 n8n 편집기 오류: '+data.message;}
});
select(chosen);
</script></body></html>

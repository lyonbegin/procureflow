<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT Android Remote</title><style>
:root{color-scheme:light;--bg:#fff;--side:#f7f7f8;--text:#181818;--muted:#777;--border:#e5e5e5;--bubble:#f3f3f3;--focus:#181818}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}main{display:flex;height:100dvh}aside{width:246px;background:var(--side);border-right:1px solid var(--border);padding:17px 13px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}.brand{font-size:19px;font-weight:700;padding:10px 8px}.muted{color:var(--muted);font-size:12px}.side-btn{display:block;width:100%;background:transparent;border:none;text-align:left;font:inherit;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}.side-btn:hover{background:#e9e9eb}.settings{margin-top:auto;display:grid;gap:8px;padding:12px 7px;border-top:1px solid var(--border)}.settings input{width:100%;border:1px solid #ddd;background:white;padding:10px;border-radius:8px;font:inherit}button{cursor:pointer}.connect{border:1px solid #ccc;background:white;border-radius:8px;padding:9px}.shell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch}.header{height:59px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;border-bottom:1px solid #f0f0f0;font-size:17px;font-weight:600}.status{font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#c93d3d;display:inline-block}.dot.online{background:#23a367}.feed{overflow:auto;flex:1;max-width:820px;width:100%;margin:0 auto;padding:26px 30px;display:flex;flex-direction:column;gap:28px}.empty{margin:auto;text-align:center;font-size:25px;font-weight:600}.msg{max-width:80%;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--bubble);border-radius:20px;padding:11px 17px}.msg.user[data-delivery]::after{content:attr(data-delivery);display:block;font-size:11px;color:#696969;padding-top:5px}.msg.user[data-delivery="전송 실패"]::after{color:#bf3535}.msg.system{color:#666;font-size:12px;align-self:center;max-width:100%;text-align:center}.msg.assistant{align-self:flex-start}.msg.assistant:before{content:'기기 응답';display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:7px}.composer-wrap{padding:14px 24px 27px;max-width:850px;width:100%;margin:auto}.composer{border:1px solid #ddd;border-radius:24px;box-shadow:0 2px 6px #00000008;padding:13px;display:flex;align-items:flex-end;gap:8px}.composer textarea{resize:none;border:0;outline:0;font:inherit;flex:1;max-height:200px;min-height:45px;line-height:1.5;padding:7px;background:transparent}.composer button{border:none;border-radius:50%;width:37px;height:37px;background:#151515;color:white;font-size:20px;flex-shrink:0}.hint{text-align:center;color:#8c8c8c;font-size:11px;padding-top:9px}.details{border-top:1px solid #eee;max-width:820px;width:100%;margin:auto}.details summary{font-size:12px;color:#777;padding:8px 24px;cursor:pointer}.diagnostics{max-height:135px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:#666;font-size:11px;padding:0 24px 10px}.no-device{font-size:12px;color:#ad5200}@media(max-width:700px){aside{width:270px;position:fixed;top:0;left:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 4px 18px #0002}aside.open{transform:translateX(0)}.sidebar-text,.settings label,.settings input,.settings small{display:block}.sidebar-text{display:inline}.feed{padding:20px}.header{padding:0 15px}.mobile-menu{display:inline-block!important}}.mobile-menu{display:none;background:transparent;border:none;font-size:22px;padding:4px 12px 4px 0}
</style></head><body><main><aside id="settings-panel"><div class="brand">ChatGPT <span class="sidebar-text">Remote</span></div><button class="side-btn" id="new">＋ <span class="sidebar-text">새 대화</span></button><button class="side-btn" id="snapshot">☰ <span class="sidebar-text">화면 읽기</span></button><div class="settings"><label class="muted" for="token">Railway 웹 콘솔 토큰</label><input type="password" id="token" placeholder="CONSOLE_TOKEN" autocomplete="off"><button class="connect" id="connect">연결</button><small class="muted">토큰은 이 브라우저 탭에만 보관됩니다.</small></div></aside><section class="shell"><header class="header"><span><button id="mobile-menu" class="mobile-menu" type="button" aria-label="연결 설정 열기">☰</button>ChatGPT <span class="muted">· Android 원격 대화</span></span><span class="status"><span class="dot" id="dot"></span><span id="status">연결 전</span></span></header><div class="feed" id="feed"><div class="empty" id="empty">안드로이드 ChatGPT와 대화</div></div><details class="details"><summary>안드로이드 접근성 화면 텍스트 / 통신 로그</summary><div class="diagnostics" id="diag">기기 연결 후 표시됩니다.</div></details><div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" rows="1" aria-label="메시지" placeholder="Android의 ChatGPT에 메시지 보내기" required></textarea><button type="submit" title="전송">↑</button></form><div class="hint">이 화면은 별도의 AI가 아닙니다. 모든 질문은 연결된 Android ChatGPT에서 실행됩니다.</div></div></section></main><script>
const $=id=>document.getElementById(id),feed=$('feed'),diag=$('diag');let sock=null,authorized=false,deviceOnline=false,authError=false;const pending=new Map();let mirrored=null;
$('mobile-menu').onclick=()=>$('settings-panel').classList.toggle('open');
function setStatus(s,online=false){$('status').textContent=s;$('dot').classList.toggle('online',online)}
function log(s){diag.textContent=(new Date().toLocaleTimeString()+' '+s+'\n'+diag.textContent).slice(0,18000)}
function message(role,text,id){$('empty')?.remove();const el=document.createElement('div');el.className='msg '+role;el.textContent=text;if(id)el.dataset.id=id;feed.append(el);feed.scrollTop=feed.scrollHeight;return el}
function cmd(action,payload={}){if(!authorized){message('system','Railway 연결을 먼저 설정하십시오.');return null;}if(!deviceOnline){message('system','안드로이드 기기가 연결되어 있지 않습니다.');return null;}const id=crypto.randomUUID();sock.send(JSON.stringify({type:'command',id,action,payload}));pending.set(id,{action,text:payload.text||''});return id}
$('connect').onclick=()=>{if(sock)sock.close();authorized=false;deviceOnline=false;authError=false;const token=$('token').value.trim();if(!token){setStatus('토큰 필요');return;}const proto=location.protocol==='https:'?'wss:':'ws:';sock=new WebSocket(proto+'//'+location.host+'/ws');setStatus('연결 중');sock.onopen=()=>sock.send(JSON.stringify({role:'console',type:'auth',token}));sock.onmessage=e=>{const m=JSON.parse(e.data);switch(m.type){case 'auth.ok':authorized=true;deviceOnline=!!m.deviceOnline;setStatus(deviceOnline?'Android 연결됨':'웹 연결 완료 · Android 대기',deviceOnline);log('웹 콘솔 인증 성공. Android 대기 시: 제어 앱의 접근성 서비스를 활성화하고 소켓 상태를 확인하십시오.');$('settings-panel').classList.remove('open');break;case 'auth.error':authError=true;setStatus('웹 콘솔 인증 실패');log('인증 실패: '+m.reason);break;case 'device.status':deviceOnline=m.online;setStatus(deviceOnline?'Android 연결됨':'웹 연결 완료 · Android 미연결',deviceOnline);log(deviceOnline?'안드로이드 기기 접속 확인':'안드로이드 기기 미접속. 제어 APK 접근성 서비스 및 소켓 상태를 확인하십시오.');break;case 'command.queued':log(m.action+' 명령 전달: '+m.id.slice(0,8));break;case 'command.result':{log('기기 실행 결과: '+JSON.stringify(m.result||{}));const p=pending.get(m.id);if(p?.action==='chat.send'){const el=Array.from(feed.querySelectorAll('.msg.user')).find(e=>e.dataset.id===m.id);if(el)el.dataset.delivery=(m.result?.stage||'').startsWith('send_confirmed')?'Android 전송 확인':'전송 실행 · 확인 필요';}pending.delete(m.id);break;}case 'command.error':{const p=pending.get(m.id);if(p?.action==='chat.send'){const el=Array.from(feed.querySelectorAll('.msg.user')).find(e=>e.dataset.id===m.id);if(el)el.dataset.delivery='전송 실패';if(!$('prompt').value.trim())$('prompt').value=p.text||'';}message('system','Android 전송 실패: '+m.reason+' · 입력 내용은 보존했습니다.');pending.delete(m.id);break;}case 'ui.snapshot':{const texts=(m.nodes||[]).map(n=>n.text||n.desc||'').filter(Boolean);diag.textContent='[접근성 화면 텍스트 — 추출 자료]\n'+texts.join('\n').slice(-16000)+'\n\n'+diag.textContent.slice(0,2500);if(texts.length){if(!mirrored)mirrored=message('assistant','');mirrored.textContent='[Android 화면에서 추출한 텍스트 · 답변 분리 미검증]\n'+texts.join('\n').slice(-9000);}break;}case 'device.log':log('기기: '+m.message);break;}};sock.onclose=e=>{authorized=false;deviceOnline=false;setStatus(authError?'웹 토큰 인증 실패':'WebSocket 연결 종료');log('웹 소켓 종료 코드: '+e.code);};sock.onerror=()=>{setStatus('웹 소켓 통신 오류');log('웹 소켓 오류 발생: Railway 서버 상태를 확인하십시오.');}};
$('form').onsubmit=e=>{e.preventDefault();const text=$('prompt').value.trim();if(!text)return;const id=cmd('chat.send',{text});if(id){mirrored=null;const bubble=message('user',text,id);bubble.dataset.delivery='Android 전송 확인 중';$('prompt').value='';}};$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});$('new').onclick=()=>cmd('chat.new');$('snapshot').onclick=()=>cmd('ui.snapshot');
</script></body></html>
